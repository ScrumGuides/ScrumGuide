- id: guides_intro_text
  translation: "了解有效的实践，以及如何运用它们，在任何流程中优化工作流与价值交付。这里是知识与良好实践的完整资源。{{ .Site.Title }} 是实用指南之家：一个免费、由社区推动的参考，用于在知识工作中运用经过验证的方法。这些指南界定了改善流动、优化价值交付、增强团队可持续性所需的核心实践与度量。它们支持在各行各业中可扩展的采用，并与其他现代工作流方法互为补充。"

