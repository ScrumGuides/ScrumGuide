- id: open_source_description
  translation: "这是一个依靠社区协作的开源项目。无论你想提出改进、报告问题还是贡献内容，都欢迎参与。部分指南不接受贡献，但仍列于此处作为参考。我们可以共同让这些资源对全世界的实践者，以及任何希望提升工作流效率与价值交付的人，更有价值。"

