- id: implementations_section_description
  translation: "在特定情境中运用 Scrum 的方式。每一份都停留在 Scrum 意图之内，并为某种情形补充指引——多个团队共同开发一个产品、管理流动、刚刚起步——而不改变 Scrum 的要求。"

