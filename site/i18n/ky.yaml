- id: open_source_title
  translation: "Ачык булак, жамаат жүргүзөт"

- id: open_source_description
  translation: "Бул жамааттын кошо иштешинен жашаган ачык булактуу долбоор. Жакшыртууларды сунуштагыңыз, көйгөйлөрдү билдиргиңиз же мазмун менен салым кошкуңуз келсе, кош келиңиз. Айрым колдонмолор салым кабыл албайт, бирок ушул жерде шилтеме катары турат. Кошо биз ушул булактарды бүт дүйнөдөгү колдонуучулар үчүн жана иш агымынын натыйжалуулугун жана баалуулук жеткирүүнү жакшыртууну каалаган ар ким үчүн баалуураак кыла алабыз."

- id: at_a_glance_title
  translation: "Кыскача"

- id: join_discussion_button
  translation: "Талкууга кошулуңуз"

- id: join_discussion_title
  translation: "{{ .Site.Title }} жөнүндө талкууга кошулуңуз"

- id: join_discussion_description
  translation: "Жамаат менен таанышыңыз, көргөнүңүздү бөлүшүңүз жана {{ .Site.Title }} келечегин калыптандырууга жардам бериңиз. Ушул колдонмолордун колдонуучулар үчүн толук дене болушу үчүн силердин салымыңар алмаштырылгыс."

- id: guides_intro_text
  translation: "Иштеген тажрыйбаларды жана аларды кайсы процессте болсо да иш агымын жана баалуулук жеткирүүнү эң ыңгайлуу кылууга кантип колдонууну үйрөнүңүз. Ушул жерде билимдин жана жакшы тажрыйбалардын бүт денеси. {{ .Site.Title }} — тажрыйбалык колдонмолордун үйү: билим ишинде далилденген ыкмаларды колдонуу үчүн эркин, жамаат жүргүзгөн шилтеме. Колдонмолор агымды жакшыртуу, баалуулук жеткирүүнү эң ыңгайлуу кылуу жана топтун туруктуулугун бекемдөө үчүн керектүү негизги тажрыйбалар менен ченөөлөрдү чектейт. Алар ар кыл тармакта чоңойтулуучу кабыл алууну колдойт жана иш агымынын башка заманбап ыкмаларын толуктайт."

