- id: implementations_section_description
  translation: "Scrum'ду белгилүү бир шартта колдонуу жолдору. Алардын ар бири Scrum'дун ниетинин ичинде калат жана кандайдыр бир жагдай үчүн багыт кошот — бир өнүмдө бир нече топ, агымды башкаруу, баштоо — Scrum эмнени талап кылганын өзгөртпөй."

