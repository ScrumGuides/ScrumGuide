- id: join_discussion_description
  translation: "ኅብረተሰቡን ያግኙ፣ የሚያዩትን ያጋሩ፣ እና የ{{ .Site.Title }} መጪውን ጊዜ ለመቅረጽ ይርዱ። እነዚህ መምሪያዎች ለሚተገብሩ ሙሉ አካል እንዲሆኑ የእርስዎ አስተዋጽኦ የማይተካ ነው።"

- id: guides_intro_text
  translation: "የሚሠሩትን ልማዶች፣ እና በማንኛውም ሂደት ውስጥ የሥራ ፍሰቱንና ጥቅም ማድረሱን ይበልጥ ለማሳመር እንዴት እንደሚጠቀሙባቸው ይማሩ። እዚህ ሁሉም የእውቀትና የመልካም ልማዶች አካል አለ። {{ .Site.Title }} የተግባራዊ መምሪያዎች ቤት ነው፦ በእውቀት ሥራ ውስጥ የተረጋገጡ ዘዴዎችን ለመጠቀም ነጻ፣ በኅብረተሰቡ የሚመራ ማጣቀሻ። መምሪያዎቹ ፍሰቱን ለማሻሻል፣ ጥቅም ማድረሱን ይበልጥ ለማሳመርና የቡድኑን ጽናት ለማጠናከር የሚያስፈልጉትን ዋና ልማዶችና መለኪያዎች ይገድባሉ። በተለያዩ ዘርፎች ሊሰፋ የሚችል ተቀባይነትን ይደግፋሉ እና የሥራ ፍሰት ሌሎች ዘመናዊ ዘዴዎችን ያሟላሉ።"

