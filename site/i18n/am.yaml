- id: open_source_description
  translation: "ይህ በኅብረተሰቡ ትብብር የሚኖር ክፍት ምንጭ ፕሮጀክት ነው። ማሻሻያዎች ማቅረብ፣ ችግሮች ማሳወቅ ወይም በይዘት አስተዋጽኦ ማድረግ ከፈለጉ፣ እንኳን ደህና መጡ። አንዳንድ መምሪያዎች አስተዋጽኦ አይቀበሉም፣ ግን እዚህ እንደ ማጣቀሻ ይቆማሉ። አንድ ላይ እነዚህን ምንጮች በዓለም ዙሪያ ለሚተገብሩና የሥራ ፍሰት ውጤታማነትንና ጥቅም ማድረስን ለማሻሻል ለሚፈልግ ለማንኛውም ሰው ይበልጥ ጠቃሚ ማድረግ እንችላለን።"

