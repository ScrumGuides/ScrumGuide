  translation: "Scrumን በተወሰነ ሁኔታ ለመጠቀም የሚቻሉ መንገዶች። ከእነሱ ሁሉም በScrum ዓላማ ውስጥ ይቀራል እና Scrum ለሚጠይቀው ሳይቀይር ለአንድ ሁኔታ አመራር ይጨምራል — በአንድ ውጤት ላይ በርካታ ቡድኖች፣ ፍሰቱን ማስተዳደር፣ መጀመር።"

