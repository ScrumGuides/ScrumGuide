- id: open_source_title
  translation: "Atviras kodas, veda bendruomenė"

- id: open_source_description
  translation: "Tai atviro kodo darbas, kuris gyvena iš bendruomenės bendradarbiavimo. Jei norite pasiūlyti pagerinimų, pranešti apie bėdas ar prisidėti turiniu, esate laukiami. Kai kurie vadovai prisidėjimų nepriima, bet stovi čia kaip nuoroda. Drauge galime šiuos šaltinius padaryti vertingesnius praktikuojantiems visame pasaulyje ir visiems, kas nori pagerinti darbo tekėjimo veiksmingumą ir vertės pateikimą."

- id: at_a_glance_title
