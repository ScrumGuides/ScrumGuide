- id: join_discussion_title
  translation: "Prisijunkite prie kalbos apie {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Susitikite su bendruomene, pasidalykite tuo, ką matote, ir padėkite lipdyti {{ .Site.Title }} ateitį. Jūsų prisidėjimas būtinas, kad šie vadovai taptų visu kūnu praktikuojantiems."

- id: guides_intro_text
  translation: "Išmokite praktikų, kurios veikia, ir kaip jas naudoti darbo tekėjimui bei vertės pateikimui bet kuriame procese optimizuoti. Čia yra visas žinių ir gerų praktikų kūnas. {{ .Site.Title }} yra praktinių vadovų namai: laisvas, bendruomenės vedamas šaltinis įrodytiems metodams naudoti žinių darbe. Vadovai apibrėžia pamatines praktikas ir matus, kurių reikia tekėjimui pagerinti, vertės pateikimui optimizuoti ir komandos ištvermei sustiprinti. Jie palaiko mastelį turintį perėmimą įvairiose srityse ir papildo kitus šiuolaikinius darbo tekėjimo metodus."

