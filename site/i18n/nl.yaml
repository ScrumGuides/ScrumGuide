- id: implementations_section_description
  translation: "Manieren om Scrum in een bepaalde context toe te passen. Elke gids blijft binnen wat Scrum beoogt en voegt aanwijzingen toe voor een situatie — meerdere teams aan één product, het beheersen van flow, de start — zonder te veranderen wat Scrum vereist."

- id: extensions_section_title
  translation: "Uitbreidingen"

- id: extensions_section_description
  translation: "Praktijken die verder gaan dan waar Scrum over gaat. Een uitbreiding pretendeert niet Scrum te zijn en verandert Scrum niet; ze pakt een vraagstuk op dat Scrum openlaat, zoals het meten van de waarde die een product oplevert."

