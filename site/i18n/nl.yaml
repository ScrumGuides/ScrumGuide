- id: join_discussion_description
  translation: "Ga in gesprek met de community, deel je inzichten en help de toekomst van {{ .Site.Title }} vormgeven. Jullie bijdragen zijn onmisbaar om deze gidsen tot volledige bronnen voor de praktijk te maken."

- id: guides_intro_text
  translation: "Leer effectieve praktijken kennen en hoe je ze toepast om workflow en waardelevering te optimaliseren, door welk proces heen ook. Dit is je volledige bron voor kennis en goede praktijken. {{ .Site.Title }} is het thuis van praktische gidsen: een gratis, door de community gedragen naslagwerk voor het toepassen van bewezen methoden in kenniswerk. De gidsen beschrijven de kernpraktijken en de metrieken die nodig zijn om flow te verbeteren, waardelevering te optimaliseren en teams houdbaar te houden. Ze ondersteunen opschaalbare invoering in uiteenlopende sectoren en vullen andere moderne benaderingen van workflow aan."

