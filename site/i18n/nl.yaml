- id: open_source_title
  translation: "Opensource en gedragen door de community"

- id: open_source_description
  translation: "Dit is een opensourceproject dat leeft van samenwerking in de community. Of je verbeteringen wilt voorstellen, problemen wilt melden of inhoud wilt bijdragen: je deelname is welkom. Sommige gidsen staan niet open voor bijdragen maar staan hier als naslag. Samen kunnen we deze bronnen nog waardevoller maken voor de praktijk wereldwijd en voor iedereen die workflow en waardelevering wil verbeteren."

