  translation: "মুক্ত সূত্র, সমাজই চালায়"

- id: open_source_description
  translation: "এটি একটি মুক্ত-সূত্র প্রকল্প, যা সমাজের সহযোগিতায় বেঁচে থাকে। উন্নতির প্রস্তাব দিতে, সমস্যা জানাতে বা বিষয়বস্তু দিয়ে অবদান রাখতে চাইলে আপনি স্বাগত। কিছু নির্দেশিকা অবদান নেয় না, তবু সূত্র হিসেবে এখানে থাকে। একসঙ্গে আমরা এই সম্পদগুলিকে সারা পৃথিবীর প্রয়োগকারীদের জন্য এবং কাজের প্রবাহের ফলপ্রসূতা ও মূল্য পৌঁছে দেওয়া ভালো করতে চান এমন যে কারও জন্য আরও মূল্যবান করতে পারি।"

- id: at_a_glance_title
  translation: "এক নজরে"

- id: join_discussion_button
  translation: "আলোচনায় যোগ দিন"

- id: join_discussion_title
  translation: "{{ .Site.Title }} নিয়ে আলোচনায় যোগ দিন"

- id: join_discussion_description
  translation: "সমাজের সঙ্গে দেখা করুন, আপনি যা দেখছেন তা ভাগ করুন, এবং {{ .Site.Title }}-এর ভবিষ্যৎ গড়তে সাহায্য করুন। এই নির্দেশিকাগুলি যাঁরা প্রয়োগ করেন তাঁদের জন্য পুরো দেহ হয়ে উঠতে আপনাদের অবদান অপরিহার্য।"

- id: guides_intro_text
  translation: "যে অভ্যাসগুলি কাজ করে তা শিখুন, আর যেকোনো প্রক্রিয়ায় কাজের প্রবাহ ও মূল্য পৌঁছে দেওয়াকে সবচেয়ে ভালো করতে সেগুলি কীভাবে কাজে লাগাবেন তা জানুন। এখানেই জ্ঞান ও ভালো অভ্যাসের পুরো দেহ। {{ .Site.Title }} হাতে-কলমে নির্দেশিকার ঘর: জ্ঞানের কাজে প্রমাণিত পদ্ধতি কাজে লাগানোর জন্য একটি মুক্ত, সমাজ-চালিত সূত্র। নির্দেশিকাগুলি প্রবাহ ভালো করতে, মূল্য পৌঁছে দেওয়াকে সবচেয়ে ভালো করতে এবং দলের টেকসইতা দৃঢ় করতে যে মূল অভ্যাস ও মাপ দরকার, সেগুলির গণ্ডি টানে। এগুলি নানা ক্ষেত্রে বাড়ানো যায় এমন গ্রহণকে সমর্থন করে এবং কাজের প্রবাহের অন্য আধুনিক পদ্ধতির পরিপূরক হয়।"

