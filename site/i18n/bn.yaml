- id: implementations_section_description
  translation: "কোনো নির্দিষ্ট প্রেক্ষিতে Scrum কাজে লাগানোর উপায়। তাদের প্রতিটিই Scrum-এর উদ্দেশ্যের ভিতরেই থাকে এবং Scrum যা চায় তা না বদলে কোনো একটি পরিস্থিতির জন্য পথনির্দেশ যোগ করে — একটি পণ্যে একাধিক দল, প্রবাহ চালানো, শুরু করা।"

