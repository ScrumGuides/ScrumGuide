- id: extensions_section_description
  translation: "Arferion sy'n cyrraedd tu hwnt i'r hyn y mae Scrum yn ymdrin ag ef. Nid yw estyniad yn ei gynnig ei hun yn Scrum ac nid yw'n ei newid; mae'n ymgymryd â chwestiwn y mae Scrum yn ei adael ar agor, fel mesur y gwerth y mae cynnyrch yn ei ddwyn."

