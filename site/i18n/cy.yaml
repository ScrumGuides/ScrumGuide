- id: implementations_section_description
  translation: "Ffyrdd o ddefnyddio Scrum mewn cyd-destun arbennig. Mae pob un yn aros o fewn bwriad Scrum ac yn ychwanegu arweiniad i ryw sefyllfa - sawl tîm ar un cynnyrch, rheoli'r llif, dechrau arni - heb newid beth y mae Scrum yn ei fynnu."

- id: extensions_section_title
