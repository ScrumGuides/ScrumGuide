- id: join_discussion_title
  translation: "Ymunwch â'r drafodaeth am {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Cyfarfodwch â'r gymuned, rhannwch yr hyn a welwch, a helpwch i lunio dyfodol {{ .Site.Title }}. Mae eich cyfraniadau'n anhepgor er mwyn i'r canllawiau hyn fod yn gorff cyflawn i ymarferwyr."

- id: guides_intro_text
  translation: "Dysgwch yr arferion sy'n gweithio, a sut i'w defnyddio i wneud y gorau o lif y gwaith ac o'r gwerth a ddanfonir mewn unrhyw broses. Dyma'r corff cyfan o wybodaeth ac arferion da. {{ .Site.Title }} yw cartref y canllawiau ymarferol: cyfeirnod rhydd, a'r gymuned sy'n ei yrru, i ddefnyddio dulliau profedig yng ngwaith gwybodaeth. Mae'r canllawiau'n amgylchynu'r arferion a'r mesurau craidd sydd raid i wella'r llif, gwneud y gorau o'r gwerth a ddanfonir, a chadarnhau cynaliadwyedd y tîm. Maent yn cynnal mabwysiadu graddadwy ar draws y diwydiannau ac yn ategu dulliau llif gwaith modern eraill."

