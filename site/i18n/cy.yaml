- id: open_source_title
  translation: "Ffynhonnell agored, a'r gymuned sy'n ei yrru"

- id: open_source_description
  translation: "Prosiect ffynhonnell agored yw hwn sy'n byw ar gydweithio'r gymuned. Os ydych am gynnig gwelliannau, adrodd materion neu gyfrannu cynnwys, croeso i chi. Nid yw rhai canllawiau'n derbyn cyfraniadau, ond maent yma'n gyfeirnod. Gyda'n gilydd gallwn wneud yr adnoddau hyn yn fwy gwerthfawr i ymarferwyr ar hyd y byd ac i unrhyw un sydd am wella effeithiolrwydd llif y gwaith a'r gwerth a ddanfonir."

- id: at_a_glance_title
