# Interface strings, Bosnian.
#
# These are this site's own words, not the publishers'. The guide documents on
# this site are the translators' published work, reproduced verbatim; the
# interface around them is translated here and has not been reviewed by a
# native speaker. Corrections to any string belong in this file.
#
# Scrum's own terms are left as that language's published Scrum Guide leaves
# them. Where it does not translate Scrum Team, Product Owner, Scrum Master,
# Sprint, Product Backlog, Sprint Backlog or Increment, neither does this.

