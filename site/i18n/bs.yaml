- id: open_source_description
  translation: "Ovo je projekat otvorenog koda koji živi od saradnje zajednice. Želite li predložiti poboljšanja, prijaviti probleme ili doprinijeti sadržajem, dobrodošli ste. Neki vodiči ne primaju doprinose, ali stoje ovdje kao referenca. Zajedno možemo ove izvore učiniti vrednijima za one koji upražnjavaju širom svijeta i za svakoga koji želi poboljšati učinkovitost toka rada i dostavu vrijednosti."

