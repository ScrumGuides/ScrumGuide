- id: open_source_title
  translation: "オープンソースとコミュニティ主導"

- id: open_source_description
  translation: "これはコミュニティの協働によって成り立つオープンソースのプロジェクトです。改善の提案、問題の報告、内容の寄与、いずれも歓迎します。一部のガイドは寄与を受け付けていませんが、参考として掲載しています。ともに、世界中で実践する方々や、ワークフローの効率と価値の提供を高めたいすべての方にとって、これらの資料をさらに有用なものにできます。"

- id: at_a_glance_title
