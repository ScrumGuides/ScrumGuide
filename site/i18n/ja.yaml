- id: join_discussion_title
  translation: "{{ .Site.Title }}の議論に参加する"

- id: join_discussion_description
  translation: "コミュニティと交わり、気づきを共有し、{{ .Site.Title }}の今後をかたちづくることに力を貸してください。これらのガイドが実践する方にとって総合的な情報源であるために、皆さんの寄与は欠かせません。"

- id: guides_intro_text
  translation: "どのようなプロセスであっても、ワークフローと価値の提供を最適化するために役立つ実践と、その適用の仕方を学べます。知識と良い実践をまとめた総合的な情報源です。{{ .Site.Title }}は実践的なガイドの拠点であり、知識労働に実証済みの方法を適用するための、無償でコミュニティ主導の参照先です。各ガイドは、フローを改善し、価値の提供を最適化し、チームの持続可能性を高めるために必要な中核的実践と指標を定めています。多様な業種における拡張可能な導入を支え、ワークフローに関する他の現代的な取り組みを補完します。"

