  translation: "Scrum-ni muayyan sharoitda ishlatish yoʻllari. Ularning har biri Scrum-ning niyati ichida qoladi va biror holat uchun yoʻl koʻrsatadi — bitta mahsulotda bir necha guruh, oqimni boshqarish, boshlash — Scrum nimani talab qilishini oʻzgartirmay."

