- id: open_source_description
  translation: "Bu jamoaning hamkorligidan yashaydigan ochiq manbali loyiha. Yaxshilashlar taklif qilmoqchi, muammolar haqida xabar bermoqchi yoki mundarija bilan hissa qoʻshmoqchi boʻlsangiz, xush kelibsiz. Baʼzi qoʻllanmalar hissa qabul qilmaydi, lekin shu yerda havola sifatida turadi. Birga biz shu manbalarni butun dunyodagi qoʻllovchilar uchun va ish oqimining samarasini hamda qiymat yetkazishni yaxshilamoqchi boʻlgan har kim uchun qimmatliroq qila olamiz."

