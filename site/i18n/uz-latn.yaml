- id: join_discussion_description
  translation: "Jamoa bilan uchrashing, koʻrganingizni ulashing va {{ .Site.Title }} kelajagini shakllantirishga yordam bering. Shu qoʻllanmalar qoʻllovchilar uchun toʻliq tana boʻlishi uchun sizlarning hissangiz oʻrnini bosa olmaydi."

- id: guides_intro_text
  translation: "Ishlaydigan amaliyotlarni va ularni har qanday jarayonda ish oqimi hamda qiymat yetkazishni eng qulay qilish uchun qanday ishlatishni oʻrganing. Shu yerda bilim va yaxshi amaliyotlarning butun tanasi. {{ .Site.Title }} — amaliy qoʻllanmalarning uyi: bilim ishida isbotlangan usullarni ishlatish uchun erkin, jamoa yuritadigan havola. Qoʻllanmalar oqimni yaxshilash, qiymat yetkazishni eng qulay qilish va guruhning chidamini mustahkamlash uchun kerak boʻlgan asosiy amaliyotlar va oʻlchovlarni chegaralaydi. Ular turli sohada kattalashtiriladigan qabulni qoʻllab-quvvatlaydi va ish oqimining boshqa zamonaviy usullarini toʻldiradi."

