- id: join_discussion_title
  translation: "Pievienojieties sarunai par {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Satiecieties ar kopienu, dalieties ar to, ko redzat, un palīdziet veidot {{ .Site.Title }} nākotni. Jūsu devums ir neatsverams, lai šie ceļveži kļūtu par pilnu kopumu praktizējošiem."

- id: guides_intro_text
  translation: "Mācieties prakses, kas strādā, un to, kā tās lietot, lai optimizētu darba plūsmu un vērtības piegādi ikvienā procesā. Šeit ir viss zināšanu un labo prakšu kopums. {{ .Site.Title }} ir praktisko ceļvežu mājas: brīva, kopienas vadīta atsauce pierādītu paņēmienu lietošanai zināšanu darbā. Ceļveži norobežo pamata prakses un mērus, kas vajadzīgi, lai uzlabotu plūsmu, optimizētu vērtības piegādi un stiprinātu komandas izturību. Tie atbalsta mērogojamu pārņemšanu dažādās nozarēs un papildina citus mūsdienu darba plūsmas paņēmienus."

