- id: open_source_title
  translation: "Atvērtais pirmkods, vada kopiena"

- id: open_source_description
  translation: "Šis ir atvērtā pirmkoda darbs, kas dzīvo no kopienas sadarbības. Ja vēlaties ieteikt uzlabojumus, ziņot par nebūšanām vai sniegt devumu ar saturu, esat gaidīti. Daži ceļveži devumus nepieņem, bet stāv šeit kā atsauce. Kopā mēs varam padarīt šos avotus vērtīgākus praktizējošiem visā pasaulē un ikvienam, kas vēlas uzlabot darba plūsmas iedarbību un vērtības piegādi."

- id: at_a_glance_title
