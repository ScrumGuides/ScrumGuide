- id: open_source_title
  translation: "Ανοιχτού κώδικα, καθοδηγούμενο από την κοινότητα"

- id: open_source_description
  translation: "Αυτό είναι ένα έργο ανοιχτού κώδικα που ζει από τη συνεργασία της κοινότητας. Αν θέλετε να προτείνετε βελτιώσεις, να αναφέρετε προβλήματα ή να συνεισφέρετε περιεχόμενο, είστε ευπρόσδεκτοι. Ορισμένοι οδηγοί δεν δέχονται συνεισφορές, αλλά βρίσκονται εδώ ως αναφορά. Μαζί μπορούμε να κάνουμε αυτούς τους πόρους πιο πολύτιμους για όσους ασκούν σε όλον τον κόσμο και για οποιονδήποτε θέλει να βελτιώσει την αποδοτικότητα της ροής εργασίας και την παράδοση αξίας."

- id: at_a_glance_title
  translation: "Με μια ματιά"

- id: join_discussion_button
  translation: "Μπείτε στη συζήτηση"

- id: join_discussion_title
  translation: "Μπείτε στη συζήτηση για το {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Συναντήστε την κοινότητα, μοιραστείτε αυτά που βλέπετε και βοηθήστε να διαμορφωθεί το μέλλον του {{ .Site.Title }}. Οι συνεισφορές σας είναι απαραίτητες για να γίνουν αυτοί οι οδηγοί το πλήρες σώμα για όσους ασκούν."

- id: guides_intro_text
  translation: "Μάθετε τις πρακτικές που δουλεύουν και πώς να τις χρησιμοποιείτε για να βελτιστοποιείτε τη ροή εργασίας και την παράδοση αξίας σε κάθε διεργασία. Εδώ βρίσκεται ολόκληρο το σώμα γνώσης και καλών πρακτικών. Το {{ .Site.Title }} είναι η έδρα των πρακτικών οδηγών: μια ελεύθερη αναφορά, καθοδηγούμενη από την κοινότητα, για τη χρήση δοκιμασμένων μεθόδων στην εργασία γνώσης. Οι οδηγοί περιγράφουν τις βασικές πρακτικές και τα μέτρα που χρειάζονται για να βελτιωθεί η ροή, να βελτιστοποιηθεί η παράδοση αξίας και να ενισχυθεί η βιωσιμότητα της ομάδας. Υποστηρίζουν κλιμακούμενη υιοθέτηση σε όλους τους κλάδους και συμπληρώνουν άλλες σύγχρονες μεθόδους ροής εργασίας."

