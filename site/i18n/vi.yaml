- id: join_discussion_button
  translation: "Vào cuộc bàn luận"

- id: join_discussion_title
  translation: "Vào cuộc bàn luận về {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Hãy gặp cộng đồng, chia sẻ điều bạn thấy, và giúp tạo hình cho tương lai của {{ .Site.Title }}. Phần góp của các bạn là không thể thiếu để những hướng dẫn này thành khối đầy đủ cho người thực hành."

- id: guides_intro_text
  translation: "Hãy học những thực hành chạy được và cách dùng chúng để tối ưu luồng công việc và việc mang lại giá trị trong bất cứ quy trình nào. Ở đây là toàn bộ khối kiến thức và thực hành tốt. {{ .Site.Title }} là nhà của những hướng dẫn thiết thực: một nguồn tham khảo tự do, do cộng đồng dẫn dắt, để dùng những phương pháp đã được chứng tỏ trong công việc tri thức. Các hướng dẫn vạch ra những thực hành và thước đo cốt yếu cần có để cải thiện dòng chảy, tối ưu việc mang lại giá trị và làm bền sức của nhóm. Chúng hỗ trợ việc tiếp nhận có thể mở rộng khắp các ngành và bổ sung cho những phương pháp luồng công việc hiện đại khác."

