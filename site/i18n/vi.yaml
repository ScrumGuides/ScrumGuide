- id: open_source_title
  translation: "Nguồn mở, do cộng đồng dẫn dắt"

- id: open_source_description
  translation: "Đây là một dự án nguồn mở sống nhờ sự cộng tác của cộng đồng. Nếu bạn muốn đề nghị cải thiện, báo vấn đề hay góp nội dung, bạn được chào đón. Một số hướng dẫn không nhận phần góp, nhưng vẫn ở đây để tham chiếu. Cùng nhau chúng ta có thể làm những nguồn này đáng giá hơn cho người thực hành khắp thế giới và cho bất cứ ai muốn cải thiện hiệu lực của luồng công việc và việc mang lại giá trị."

- id: at_a_glance_title
