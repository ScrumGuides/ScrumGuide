  translation: "Scrum-ды белгілі бір жағдайда қолдану жолдары. Олардың әрқайсысы Scrum-ның ниетінің ішінде қалады және қандай да бір жағдай үшін бағыт қосады — бір өнімде бірнеше топ, ағынды басқару, бастау — Scrum не талап ететінін өзгертпей."

