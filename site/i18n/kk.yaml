- id: open_source_title
  translation: "Ашық бастапқы код, қауымдастық жүргізеді"

- id: open_source_description
  translation: "Бұл қауымдастықтың бірлескен жұмысымен тіршілік ететін ашық бастапқы кодты жоба. Жақсартулар ұсынғыңыз, мәселелерді хабарлағыңыз немесе мазмұнмен үлес қосқыңыз келсе, қош келдіңіз. Кейбір нұсқаулықтар үлес қабылдамайды, бірақ осында сілтеме ретінде тұрады. Бірге біз осы дерекнамаларды бүкіл әлемдегі қолданушылар үшін және жұмыс ағынының ықпалдылығы мен құндылық жеткізуді жақсартқысы келетін әркім үшін құндырақ қыла аламыз."

- id: at_a_glance_title
  translation: "Қысқаша"

- id: join_discussion_button
