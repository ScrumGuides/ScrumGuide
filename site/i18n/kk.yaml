- id: join_discussion_title
  translation: "{{ .Site.Title }} туралы талқылауға қосылыңыз"

- id: join_discussion_description
  translation: "Қауымдастықпен танысыңыз, көргеніңізбен бөлісіңіз және {{ .Site.Title }} болашағын қалыптастыруға көмектесіңіз. Осы нұсқаулықтардың қолданушылар үшін толық дене болуы үшін сіздердің үлесі ауыстырылмайды."

- id: guides_intro_text
  translation: "Жұмыс қылатын тәжірибелерді және оларды кез келген процесте жұмыс ағыны мен құндылық жеткізуді оңтайлауға қалай қолдануды үйреніңіз. Осында білім мен жақсы тәжірибелердің бүкіл денесі. {{ .Site.Title }} — тәжірибелік нұсқаулықтардың үйі: білім жұмысында дәлелденген әдістерді қолдануға арналған еркін, қауымдастық жүргізетін сілтеме. Нұсқаулықтар ағынды жақсартуға, құндылық жеткізуді оңтайлауға және топтың төзімділігін нығайтуға керек негізгі тәжірибелер мен өлшемдерді шектейді. Олар түрлі салада ауқымдалатын қабылдауды қолдайды және жұмыс ағынының басқа заманауи әдістерін толықтырады."

