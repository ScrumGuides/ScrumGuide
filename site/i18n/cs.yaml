- id: join_discussion_description
  translation: "Potkejte komunitu, podělte se o své poznatky a pomozte utvářet budoucnost {{ .Site.Title }}. Vaše přispění je nezbytné, aby se tyto příručky staly úplným souborem pro praktiky."

- id: guides_intro_text
  translation: "Naučte se praktiky, které fungují, a jak je používat k optimalizaci pracovního toku a doručování hodnoty v jakémkoli procesu. Zde je celý soubor znalostí a dobrých praktik. {{ .Site.Title }} je domovem praktických příruček: svobodného, komunitou vedeného zdroje pro používání prověřených metod v znalostní práci. Příručky vymezují základní praktiky a měřítka potřebná k lepšímu toku, k optimalizaci doručování hodnoty a k posílení udržitelnosti teamu. Podporují škálovatelné přijetí v různých odvětvích a doplňují další moderní metody pracovního toku."

