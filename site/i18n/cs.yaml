- id: implementations_section_description
  translation: "Způsoby, jak používat Scrum v určitém kontextu. Každá z nich zůstává v rámci záměru Scrumu a přidává pokyny pro určitou situaci - více teamů na jednom produktu, řízení toku, začátky - aniž by se měnilo, co Scrum vyžaduje."

