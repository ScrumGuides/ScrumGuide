- id: open_source_description
  translation: "Toto je open source projekt, který žije ze spolupráce komunity. Chcete-li navrhnout zlepšení, nahlásit problémy nebo přispět obsahem, jste vítáni. Některé příručky přispění nepřijímají, ale jsou zde jako reference. Společně můžeme tyto zdroje učinit cennějšími pro praktiky po celém světě a pro každého, kdo chce zvýšit účinnost pracovního toku a doručování hodnoty."

- id: at_a_glance_title
