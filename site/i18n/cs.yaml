- id: extensions_section_description
  translation: "Praktiky, které sahají za to, o co se stará Scrum. Rozšíření se nevydává za Scrum ani jej nemění; bere si na starost otázku, kterou Scrum nechává otevřenou, jako je měření hodnoty, kterou produkt přináší."

