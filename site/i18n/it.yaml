- id: implementations_section_description
  translation: "Modi di applicare Scrum in un contesto particolare. Ognuna resta entro ciò che Scrum si propone e aggiunge indicazioni per una situazione — più team su un unico prodotto, la gestione del flusso, l'inizio — senza cambiare ciò che Scrum richiede."

