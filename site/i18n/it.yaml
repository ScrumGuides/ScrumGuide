- id: open_source_title
  translation: "Open source e guidato dalla comunità"

- id: open_source_description
  translation: "Questo è un progetto open source che vive della collaborazione della comunità. Se vuoi proporre miglioramenti, segnalare problemi o contribuire con contenuti, la tua partecipazione è benvenuta. Alcune guide non sono aperte ai contributi ma sono incluse qui come riferimento. Insieme possiamo rendere queste risorse ancora più utili a chi le mette in pratica nel mondo e a chiunque voglia migliorare l'efficienza del flusso di lavoro e la consegna di valore."

