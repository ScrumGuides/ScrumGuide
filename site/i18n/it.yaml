  translation: "Unisciti alla discussione su {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Confrontati con la comunità, condividi quello che sai e contribuisci a dare forma al futuro di {{ .Site.Title }}. I vostri contributi sono indispensabili perché queste guide siano risorse complete per chi le mette in pratica."

- id: guides_intro_text
  translation: "Scopri pratiche efficaci e come applicarle per ottimizzare il flusso di lavoro e la consegna di valore attraverso qualsiasi processo. Questa è la tua risorsa completa di conoscenza e buone pratiche. {{ .Site.Title }} è la casa delle guide pratiche: un riferimento gratuito, guidato dalla comunità, per applicare metodi collaudati al lavoro della conoscenza. Le guide definiscono le pratiche fondamentali e le metriche necessarie per migliorare il flusso, ottimizzare la consegna di valore e rafforzare la sostenibilità dei team. Accompagnano adozioni scalabili in settori diversi e completano altri approcci moderni al flusso di lavoro."

