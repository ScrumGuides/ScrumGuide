- id: extensions_section_description
  translation: "Փորձեր, որ հասնում են այն սահմաններից դուրս, որով զբաղվում է Scrum-ը։ Ընդլայնումը իրեն Scrum չի ներկայացնում և չի փոխում այն. ստանձնում է հարց, որ Scrum-ը բաց է թողնում, ինչպես արտադրանքի տված արժեքի չափումը։"

