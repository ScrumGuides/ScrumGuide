  translation: "Կիրառման ուղեցույցներ"

- id: implementations_section_description
  translation: "Scrum-ը որոշակի համատեքստում օգտագործելու եղանակներ։ Նրանցից յուրաքանչյուրը մնում է Scrum-ի մտադրության ներսում և ավելացնում է ուղղորդում ինչ-որ իրավիճակի համար՝ մի քանի թիմ մեկ արտադրանքի վրա, հոսքի կառավարում, սկիզբ՝ առանց փոխելու այն, ինչ Scrum-ը պահանջում է։"

- id: extensions_section_title
