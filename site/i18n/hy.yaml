- id: join_discussion_button
  translation: "Միացեք քննարկմանը"

- id: join_discussion_title
  translation: "Միացեք {{ .Site.Title }}-ի մասին քննարկմանը"

- id: join_discussion_description
  translation: "Հանդիպեք համայնքին, կիսվեք այն ամենով, ինչ տեսնում եք, և օգնեք ձևավորել {{ .Site.Title }}-ի ապագան։ Ձեր ներդրումները անփոխարինելի են, որպեսզի այս ուղեցույցները դառնան ամբողջ մարմինը կիրառողների համար։"

- id: guides_intro_text
  translation: "Սովորեք այն փորձերը, որ աշխատում են, և ինչպես օգտագործել դրանք՝ աշխատանքի հոսքը և արժեքի մատուցումը ամեն գործընթացում լավարկելու համար։ Այստեղ է գիտելիքի և լավ փորձերի ամբողջ մարմինը։ {{ .Site.Title }}-ը գործնական ուղեցույցների տունն է՝ ազատ, համայնքի վարած հղում՝ ապացուցված մեթոդները գիտելիքի աշխատանքում օգտագործելու համար։ Ուղեցույցները սահմանազատում են այն հիմնական փորձերը և չափումները, որ պետք են հոսքը բարելավելու, արժեքի մատուցումը լավարկելու և թիմի կայունությունը ամրացնելու համար։ Նրանք աջակցում են մասշտաբավորվող ընդունումը տարբեր ոլորտներում և լրացնում են աշխատանքի հոսքի այլ ժամանակակից մեթոդները։"

