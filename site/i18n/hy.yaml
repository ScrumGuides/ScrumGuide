- id: open_source_description
  translation: "Սա բաց աղբյուրի նախագիծ է, որ ապրում է համայնքի համագործակցությամբ։ Եթե ուզում եք բարելավումներ առաջարկել, խնդիրների մասին հայտնել կամ բովանդակություն ներդրել, բարի եկաք։ Որոշ ուղեցույցներ ներդրումներ չեն ընդունում, բայց կանգնած են այստեղ որպես հղում։ Միասին կարող ենք այս աղբյուրները ավելի արժեքավոր դարձնել կիրառողների համար ամբողջ աշխարհում և բոլորի համար, ով ուզում է բարելավել աշխատանքի հոսքի արդյունավետությունը և արժեքի մատուցումը։"

