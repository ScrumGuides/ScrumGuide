- id: join_discussion_title
  translation: "Alăturați-vă discuției despre {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Întâlniți comunitatea, împărtășiți ce ați înțeles și ajutați la modelarea viitorului {{ .Site.Title }}. Contribuțiile dumneavoastră sunt neapărat necesare ca aceste ghiduri să devină corpul complet pentru practicieni."

- id: guides_intro_text
  translation: "Învățați practicile care funcționează și cum să le folosiți pentru a optimiza fluxul de lucru și livrarea de valoare în orice proces. Aici se află întregul corp de cunoștințe și de bune practici. {{ .Site.Title }} este casa ghidurilor practice: o referință liberă, condusă de comunitate, pentru folosirea metodelor dovedite în munca de cunoaștere. Ghidurile delimitează practicile de bază și măsurile necesare pentru a îmbunătăți fluxul, pentru a optimiza livrarea de valoare și pentru a întări sustenabilitatea echipei. Sprijină adoptarea scalabilă în toate domeniile și completează alte metode moderne de flux de lucru."

