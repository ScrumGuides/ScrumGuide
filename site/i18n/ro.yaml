- id: extensions_section_description
  translation: "Practici care trec dincolo de ce se ocupă Scrum. O extensie nu se dă drept Scrum și nu îl schimbă; ia în seamă o chestiune pe care Scrum o lasă deschisă, cum ar fi măsurarea valorii pe care un produs livrează."

