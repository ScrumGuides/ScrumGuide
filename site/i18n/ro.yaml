- id: implementations_section_description
  translation: "Moduri de a folosi Scrum într-un context anume. Fiecare dintre ele rămâne în interiorul intenției Scrum și adaugă îndrumare pentru o situație - mai multe echipe pe un produs, gestionarea fluxului, începutul - fără a schimba ce cere Scrum."

- id: extensions_section_title
