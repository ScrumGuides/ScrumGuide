- id: open_source_title
  translation: "Open source, condus de comunitate"

- id: open_source_description
  translation: "Acesta este un proiect open source care trăiește din colaborarea comunității. Dacă doriți să propuneți îmbunătățiri, să raportați probleme sau să contribuiți cu conținut, sunteți bine-venit. Unele ghiduri nu primesc contribuții, dar stau aici ca referință. Împreună putem face aceste resurse mai valoroase pentru practicienii din toată lumea și pentru oricine dorește să îmbunătățească eficiența fluxului de lucru și livrarea de valoare."

- id: at_a_glance_title
