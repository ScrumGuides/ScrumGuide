- id: open_source_description
  translation: "Ovo je projekt otvorenoga koda koji živi od suradnje zajednice. Želite li predložiti poboljšanja, prijaviti probleme ili pridonijeti sadržajem, dobrodošli ste. Neki vodiči ne primaju doprinose, ali stoje ovdje kao referencija. Zajedno možemo ove izvore učiniti vrednijima za one koji prakticiraju diljem svijeta i za svakoga koji želi poboljšati učinkovitost toka rada i dostavu vrijednosti."

