- id: join_discussion_description
  translation: "Sretnite zajednicu, podijelite što vidite i pomozite oblikovati budućnost {{ .Site.Title }}. Vaši su doprinosi neophodni da ovi vodiči postanu cijelo tijelo za one koji prakticiraju."

- id: guides_intro_text
  translation: "Naučite prakse koje rade i kako ih koristiti da optimizirate tok rada i dostavu vrijednosti u svakom procesu. Ovdje je cijelo tijelo znanja i dobrih praksi. {{ .Site.Title }} dom je praktičnih vodiča: slobodna referencija koju vodi zajednica, za korištenje dokazanih metoda u radu sa znanjem. Vodiči ograđuju temeljne prakse i mjere potrebne da se poboljša tok, optimizira dostava vrijednosti i ojača održivost tima. Podupiru skalabilno prihvaćanje u različitim granama i dopunjuju druge suvremene metode toka rada."

