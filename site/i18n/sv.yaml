- id: extensions_section_description
  translation: "Praktiker som sträcker sig utanför vad Scrum tar hand om. En utvidgning utger sig inte för att vara Scrum och ändrar det inte; den tar sig an en fråga som Scrum lämnar öppen, som att mäta det värde en produkt levererar."

