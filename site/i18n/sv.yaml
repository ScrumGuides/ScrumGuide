- id: open_source_title
  translation: "Open source och driven av gemenskapen"

- id: open_source_description
  translation: "Det här är ett open source-projekt som lever av samarbetet i gemenskapen. Vill du föreslå förbättringar, rapportera problem eller bidra med innehåll är du välkommen. Vissa guider tar inte emot bidrag men står här som referens. Tillsammans kan vi göra dessa resurser mer värda för praktiker över hela världen och för alla som vill förbättra arbetsflödets effektivitet och värdeleveransen."

