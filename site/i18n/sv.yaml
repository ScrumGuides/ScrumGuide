- id: join_discussion_description
  translation: "Möt gemenskapen, dela din insikt och hjälp till att forma framtiden för {{ .Site.Title }}. Era bidrag är avgörande för att dessa guider ska bli hela samlingen för praktiker."

- id: guides_intro_text
  translation: "Lär dig de praktiker som fungerar och hur du använder dem för att optimera arbetsflöde och värdeleverans i varje process. Här finns hela samlingen av kunskap och goda praktiker. {{ .Site.Title }} är hemmet för praktiska guider: en fri, gemenskapsdriven referens för att använda beprövade metoder i kunskapsarbete. Guiderna avgränsar de kärnpraktiker och mått som krävs för att förbättra flödet, optimera värdeleveransen och stärka teamets uthållighet. De stöder skalbar adoption över branscher och kompletterar andra moderna arbetsflödesmetoder."

