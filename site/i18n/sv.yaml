- id: implementations_section_description
  translation: "Sätt att använda Scrum i ett bestämt sammanhang. Var och en håller sig inom Scrums avsikt och lägger till vägledning för en situation - flera team på en produkt, att styra flödet, att komma igång - utan att ändra vad Scrum kräver."

- id: extensions_section_title
