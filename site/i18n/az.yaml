  translation: "Scrum-u müəyyən şəraitdə işlətmə yolları. Onların hər biri Scrum-un niyyətinin içində qalır və hər hansı vəziyyət üçün yol göstərir — bir məhsulda bir neçə komanda, axını idarə etmə, başlama — Scrum-un tələb etdiyini dəyişdirmədən."

