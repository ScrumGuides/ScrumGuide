- id: join_discussion_title
  translation: "{{ .Site.Title }} barədə müzakirəyə qoşulun"

- id: join_discussion_description
  translation: "Birliklə görüşün, gördüyünüzü paylaşın və {{ .Site.Title }} -nin gələcəyini biçimləndirməyə kömək edin. Bu bələdçilərin tətbiq edənlər üçün tam bədən olması üçün sizin töhfəniz əvəzsizdir."

- id: guides_intro_text
  translation: "İşləyən təcrübələri və onları hər hansı prosesdə iş axını ilə dəyər çatdırmanı ən yaxşı hala salmaq üçün necə işlətməyi öyrənin. Burada bilik və yaxşı təcrübələrin bütün bədəni var. {{ .Site.Title }} praktik bələdçilərin evidir: bilik işində sübut olunmuş üsulları işlətmək üçün azad, birliyin apardığı istinad. Bələdçilər axını yaxşılaşdırmaq, dəyər çatdırmanı ən yaxşı hala salmaq və komandanın davamlılığını möhkəmlətmək üçün gərəkli olan əsas təcrübələri və ölçüləri hüdudlandırır. Onlar müxtəlif sahədə böyüdülə bilən qəbulu dəstəkləyir və iş axınının başqa müasir üsullarını tamamlayır."

