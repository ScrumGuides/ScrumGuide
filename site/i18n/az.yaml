- id: open_source_description
  translation: "Bu birliyin birgə işindən yaşayan açıq qaynaqlı layihədir. Yaxşılaşdırmalar təklif etmək, problemlər barədə bildirmək və ya mündəricatla töhfə vermək istəyirsinizsə, xoş gəlmisiniz. Bəzi bələdçilər töhfə qəbul etmir, lakin burada istinad kimi durur. Birlikdə biz bu qaynaqları bütün dünyadaki tətbiq edənlər üçün və iş axınının səmərəsini ilə dəyər çatdırmanı yaxşılaşdırmaq istəyən hər kəs üçün daha dəyərli edə bilərik."

- id: at_a_glance_title
