- id: implementations_section_description
  translation: "Cara memakai Scrum dalam suatu keadaan tertentu. Masing-masing tetap berada di dalam maksud Scrum dan menambahkan tuntunan untuk sebuah situasi - beberapa tim pada satu produk, mengelola aliran, memulai - tanpa mengubah apa yang Scrum tuntut."

