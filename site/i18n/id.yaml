- id: join_discussion_description
  translation: "Jumpailah komunitasnya, bagikan apa yang Anda lihat, dan bantulah membentuk masa depan {{ .Site.Title }}. Sumbangan Anda tak tergantikan agar panduan-panduan ini menjadi himpunan yang lengkap bagi yang menjalankannya."

- id: guides_intro_text
  translation: "Pelajari praktik yang berjalan dan cara memakainya untuk mengoptimalkan alur kerja dan penghantaran nilai dalam proses apa pun. Di sini ada seluruh himpunan pengetahuan dan praktik yang baik. {{ .Site.Title }} adalah rumah panduan praktis: acuan bebas yang digerakkan komunitas untuk memakai cara yang terbukti dalam kerja pengetahuan. Panduan-panduan ini membatasi praktik dan ukuran pokok yang diperlukan untuk memperbaiki aliran, mengoptimalkan penghantaran nilai, dan memperkuat daya tahan tim. Mereka mendukung penerapan yang dapat dibesarkan di berbagai bidang dan melengkapi cara alur kerja modern lainnya."

