- id: open_source_title
  translation: "Sumber terbuka, digerakkan komunitas"

- id: open_source_description
  translation: "Ini adalah proyek sumber terbuka yang hidup dari kerja sama komunitas. Kalau Anda hendak mengusulkan perbaikan, melaporkan masalah, atau menyumbang isi, Anda disambut. Beberapa panduan tidak menerima sumbangan, tetapi berdiri di sini sebagai acuan. Bersama kita dapat membuat sumber-sumber ini lebih bernilai bagi yang menjalankannya di seluruh dunia dan bagi siapa pun yang hendak memperbaiki keefektifan alur kerja dan penghantaran nilai."

