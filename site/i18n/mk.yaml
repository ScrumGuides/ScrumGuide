- id: join_discussion_title
  translation: "Придружете се на разговорот за {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Сретнете ја заедницата, споделете што видите и помогнете да се обликува иднината на {{ .Site.Title }}. Вашите придонеси се неопходни за овие водичи да станат целото тело за оние што го применуваат."

- id: guides_intro_text
  translation: "Научете ги практиките што работат и како да ги користите за да го оптимизирате текот на работата и доставата на вредност во секој процес. Тука е целото тело од знање и добри практики. {{ .Site.Title }} е домот на практичните водичи: слободна упатница водена од заедницата, за користење на докажани методи во работата со знање. Водичите ги ограничуваат основните практики и мерки потребни за да се подобри текот, да се оптимизира доставата на вредност и да се зајакне издржливоста на тимот. Поддржуваат скалабилно прифаќање во различни гранки и ги дополнуваат другите современи методи на тек на работата."

