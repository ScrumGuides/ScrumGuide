- id: open_source_title
  translation: "Отворен код, го води заедницата"

- id: open_source_description
  translation: "Ова е проект со отворен код што живее од соработката на заедницата. Ако сакате да предложите подобрувања, да пријавите проблеми или да придонесете со содржина, добредојдени сте. Некои водичи не примаат придонеси, но стојат тука како упатница. Заедно можеме да ги сториме овие извори повредни за оние што го применуваат по целиот свет и за секој што сака да ја подобри ефикасноста на текот на работата и доставата на вредност."

- id: at_a_glance_title
