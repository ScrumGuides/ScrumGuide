- id: implementations_section_description
  translation: "Начини да се користи Scrum во определен контекст. Секој од нив останува во рамките на намерата на Scrum и додава упатства за некоја ситуација - повеќе тимови на еден производ, управување со текот, почетокот - без да менува што бара Scrum."

