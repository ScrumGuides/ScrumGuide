- id: open_source_title
  translation: "Open source, tworzone przez społeczność"

- id: open_source_description
  translation: "To projekt open source, który żyje współpracą społeczności. Jeśli chcesz proponować ulepszenia, zgłaszać problemy albo dodawać treści, twój udział jest mile widziany. Niektóre przewodniki nie są otwarte na zmiany, ale są tu zamieszczone jako odniesienie. Razem możemy sprawić, że te materiały będą jeszcze cenniejsze dla praktyków na całym świecie i dla każdego, kto chce poprawić skuteczność przepływu pracy i dostarczania wartości."

- id: at_a_glance_title
