- id: join_discussion_title
  translation: "Włącz się do rozmowy o {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Rozmawiaj ze społecznością, dziel się spostrzeżeniami i pomóż kształtować przyszłość {{ .Site.Title }}. Wasz wkład jest niezbędny, by te przewodniki były pełnym źródłem dla praktyków."

- id: guides_intro_text
  translation: "Poznaj skuteczne praktyki i sposoby ich stosowania, by optymalizować przepływ pracy i dostarczanie wartości w dowolnym procesie. To twoje pełne źródło wiedzy i dobrych praktyk. {{ .Site.Title }} jest domem praktycznych przewodników: darmowym, tworzonym przez społeczność punktem odniesienia dla stosowania sprawdzonych metod w pracy opartej na wiedzy. Przewodniki opisują podstawowe praktyki i miary potrzebne, by poprawić przepływ, zoptymalizować dostarczanie wartości i wzmocnić trwałość zespołów. Wspierają wdrożenia na dużą skalę w różnych branżach i uzupełniają inne nowoczesne podejścia do przepływu pracy."

