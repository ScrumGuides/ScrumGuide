- id: implementations_section_description
  translation: "Sposoby stosowania Scruma w określonym kontekście. Każdy pozostaje w granicach tego, czemu Scrum służy, i dodaje wskazówki dla konkretnej sytuacji — kilka zespołów nad jednym produktem, zarządzanie przepływem, początki — nie zmieniając tego, czego Scrum wymaga."

- id: extensions_section_title
  translation: "Rozszerzenia"

- id: extensions_section_description
  translation: "Praktyki wychodzące poza to, czym zajmuje się Scrum. Rozszerzenie nie twierdzi, że jest Scrumem, i go nie zmienia; zajmuje się kwestią, którą Scrum pozostawia otwartą, na przykład mierzeniem wartości dostarczanej przez produkt."

