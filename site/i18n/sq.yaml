- id: open_source_title
  translation: "Kod i hapur, e drejton bashkësia"

- id: open_source_description
  translation: "Ky është një projekt me kod të hapur që rron nga bashkëpunimi i bashkësisë. Nëse doni të propozoni përmirësime, të raportoni shqetësime ose të jepni përmbajtje, jeni të mirëpritur. Disa udhëzuesa nuk pranojnë dhurata, por ndodhen këtu si referencë. Bashkë mund t'i bëjmë këta burime më të vlefshme për ushtruesat nëpër botë dhe për këdo që do të përmirësojë efektshmërinë e rrjedhës së punës dhe dorëzimin e vlerës."

- id: at_a_glance_title
  translation: "Shkurt"

- id: join_discussion_button
  translation: "Bashkohuni me bisedën"

- id: join_discussion_title
  translation: "Bashkohuni me bisedën për {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Takoni bashkësinë, ndani atë që shihni dhe ndihmoni t'i dhuroni formë së ardhmes së {{ .Site.Title }}. Dhuratat e tua janë të domosdoshme që këta udhëzuesa të bëhen trupi i plotë për ushtruesat."

- id: guides_intro_text
  translation: "Mësoni praktikat që funksionojnë dhe si t'i përdorni për të optimizuar rrjedhën e punës dhe dorëzimin e vlerës në çdo proces. Këtu është i gjithë trupi i dijes dhe i praktikave të mira. {{ .Site.Title }} është shtëpia e udhëzuesave praktikë: një referencë e lirë, e drejtuar nga bashkësia, për të përdorur metoda të provuara në punën me dije. Udhëzuesat rrethojnë praktikat dhe masat themelore që duhen për të përmirësuar rrjedhën, për të optimizuar dorëzimin e vlerës dhe për të forcuar qëndrueshmërinë e ekipit. Mbështesin marrjen e shkallëzueshme nëpër degë dhe plotësojnë metoda të tjera bashkëkohore të rrjedhës së punës."

