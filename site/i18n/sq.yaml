  translation: "Mënyra për të përdorur Scrum në një kontekst të caktuar. Secili nga ata mbetet brenda qëllimit të Scrum dhe shton udhërrëfim për një gjendje - disa ekipe në një produkt, drejtimi i rrjedhës, nisja - pa ndryshuar çfarë kërkon Scrum."

