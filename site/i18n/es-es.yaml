- id: join_discussion_description
  translation: "Participa con la comunidad, comparte lo que sabes y ayuda a dar forma al futuro de {{ .Site.Title }}. Vuestras aportaciones son imprescindibles para que estas guías sean recursos completos para quienes las aplican."

- id: guides_intro_text
  translation: "Conoce prácticas eficaces y cómo aplicarlas para optimizar el flujo de trabajo y la entrega de valor en cualquier proceso. Este es tu recurso completo de conocimiento y buenas prácticas. {{ .Site.Title }} es el hogar de las guías prácticas: una referencia gratuita, impulsada por la comunidad, para aplicar métodos probados al trabajo del conocimiento. Las guías definen las prácticas fundamentales y las métricas necesarias para mejorar el flujo, optimizar la entrega de valor y favorecer la sostenibilidad de los equipos. Acompañan adopciones escalables en sectores diversos y complementan otros enfoques modernos del flujo de trabajo."

