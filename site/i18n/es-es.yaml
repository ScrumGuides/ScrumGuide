- id: implementations_section_description
  translation: "Formas de aplicar Scrum en un contexto concreto. Cada una se mantiene dentro de lo que Scrum pretende y añade orientación para una situación —varios equipos en un mismo producto, la gestión del flujo, los primeros pasos— sin cambiar lo que Scrum exige."

- id: extensions_section_title
  translation: "Extensiones"

- id: extensions_section_description
  translation: "Prácticas que van más allá de lo que Scrum aborda. Una extensión no pretende ser Scrum ni lo modifica; se ocupa de una cuestión que Scrum deja abierta, como medir el valor que entrega un producto."

