- id: open_source_description
  translation: "Este es un proyecto de código abierto que vive de la colaboración de la comunidad. Si quieres proponer mejoras, informar de problemas o aportar contenido, tu participación es bienvenida. Algunas guías no están abiertas a aportaciones, pero se incluyen aquí como referencia. Juntos podemos hacer que estos recursos sean aún más valiosos para quienes los aplican en todo el mundo y para cualquiera que quiera mejorar la eficiencia del flujo de trabajo y la entrega de valor."

