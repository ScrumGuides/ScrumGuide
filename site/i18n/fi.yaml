- id: open_source_title
  translation: "Avointa lähdekoodia, yhteisön ylläpitämä"

- id: open_source_description
  translation: "Tämä on avoimen lähdekoodin hanke, joka elää yhteisön yhteistyöstä. Jos haluat ehdottaa parannuksia, ilmoittaa ongelmista tai tuottaa sisältöä, olet tervetullut. Jotkin oppaat eivät ota vastaan panoksia, mutta ovat täällä viitteenä. Yhdessä voimme tehdä näistä aineistoista arvokkaampia harjoittajille kaikkialla maailmassa ja kaikille, jotka haluavat parantaa työnkulun tehokkuutta ja arvontuottoa."

