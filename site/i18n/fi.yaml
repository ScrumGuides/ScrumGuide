- id: implementations_section_description
  translation: "Tapoja käyttää Scrumia tietyssä asiayhteydessä. Jokainen niistä pysyy Scrumin tarkoituksen sisällä ja lisää ohjausta johonkin tilanteeseen - useita tiimejä yhdellä tuotteella, virtauksen ohjaaminen, alkuun pääseminen - muuttamatta sitä, mitä Scrum vaatii."

- id: extensions_section_title
