- id: extensions_section_description
  translation: "Käytäntöjä, jotka ulottuvat sen ulkopuolelle, mistä Scrum huolehtii. Laajennus ei esiinny Scrumina eikä muuta sitä; se tarttuu kysymykseen, jonka Scrum jättää avoimeksi, kuten tuotteen tuottaman arvon mittaamiseen."

