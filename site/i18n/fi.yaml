  translation: "Liity keskusteluun teoksesta {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Kohtaa yhteisö, jaa näkemyksesi ja auta muovaamaan teoksen {{ .Site.Title }} tulevaisuutta. Panoksenne on välttämätön, jotta näistä oppaista tulee harjoittajien koko kokoelma."

- id: guides_intro_text
  translation: "Opi käytännöt, jotka toimivat, ja miten käytät niitä työnkulun ja arvontuoton optimointiin missä tahansa prosessissa. Tässä on koko tiedon ja hyvien käytäntöjen kokoelma. {{ .Site.Title }} on käytännöllisten oppaiden koti: vapaa, yhteisön ylläpitämä lähdeteos todistettujen menetelmien käyttöön tietotyössä. Oppaat rajaavat ne ydinkäytännöt ja mittarit, joita virtauksen parantaminen, arvontuoton optimointi ja tiimin kestävyyden vahvistaminen vaativat. Ne tukevat skaalautuvaa käyttöönottoa toimialojen yli ja täydentävät muita nykyaikaisia työnkulun menetelmiä."

