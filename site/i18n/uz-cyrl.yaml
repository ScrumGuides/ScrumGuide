- id: open_source_title
  translation: "Очиқ манба, жамоа юритади"

- id: open_source_description
  translation: "Бу жамоанинг ҳамкорлигидан яшайдиган очиқ манбали лойиҳа. Яхшилашлар таклиф қилмоқчи, муаммолар ҳақида хабар бермоқчи ёки мундарижа билан ҳисса қўшмоқчи бўлсангиз, хуш келибсиз. Баъзи қўлланмалар ҳисса қабул қилмайди, лекин шу ерда ҳавола сифатида туради. Бирга биз шу манбаларни бутун дунёдаги қўлловчилар учун ва иш оқимининг самарасини ҳамда қиймат етказишни яхшиламоқчи бўлган ҳар ким учун қимматлироқ қила оламиз."

- id: at_a_glance_title
  translation: "Қисқача"

- id: join_discussion_button
  translation: "Муҳокамага қўшилинг"

- id: join_discussion_title
  translation: "{{ .Site.Title }} ҳақидаги муҳокамага қўшилинг"

- id: join_discussion_description
  translation: "Жамоа билан учрашинг, кўрганингизни улашинг ва {{ .Site.Title }} келажагини шакллантиришга ёрдам беринг. Шу қўлланмалар қўлловчилар учун тўлиқ тана бўлиши учун сизларнинг ҳиссангиз ўрнини боса олмайди."

- id: guides_intro_text
  translation: "Ишлайдиган амалиётларни ва уларни ҳар қандай жараёнда иш оқими ҳамда қиймат етказишни енг қулай қилиш учун қандай ишлатишни ўрганинг. Шу ерда билим ва яхши амалиётларнинг бутун танаси. {{ .Site.Title }} — амалий қўлланмаларнинг уйи: билим ишида исботланган усулларни ишлатиш учун еркин, жамоа юритадиган ҳавола. Қўлланмалар оқимни яхшилаш, қиймат етказишни енг қулай қилиш ва гуруҳнинг чидамини мустаҳкамлаш учун керак бўлган асосий амалиётлар ва ўлчовларни чегаралайди. Улар турли соҳада катталаштириладиган қабулни қўллаб-қувватлайди ва иш оқимининг бошқа замонавий усулларини тўлдиради."

