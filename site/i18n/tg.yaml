- id: implementations_section_description
  translation: "Роҳҳои истифодаи Scrum дар шароити муайян. Ҳар яке аз онҳо дар дохили ниёти Scrum мемонад ва барои ҳолате роҳнамоӣ меафзояд — якчанд гурӯҳ бар як маҳсулот, идораи ҷараён, оғоз — бидуни тағйири он чи Scrum талаб мекунад."

