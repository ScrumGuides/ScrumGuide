  translation: "Таҷрибаҳое, ки ба берун аз он мерасанд, ки Scrum бо он сарукор дорад. Густариш худро Scrum намегӯяд ва онро тағйир намедиҳад; он саволе мегирад, ки Scrum кушода мегузорад, мисли чен кардани арзише, ки маҳсулот медиҳад."

