- id: open_source_title
  translation: "Сарчашмаи кушод, ҷамоат пеш мебарад"

- id: open_source_description
  translation: "Ин лоиҳаи сарчашмаи кушод аст, ки аз ҳамкории ҷамоат зиндагӣ мекунад. Агар беҳтаркуниҳо пешниҳод кардан, дар бораи мушкилот хабар додан ё бо мундариҷа саҳм гузоштан хоҳед, хуш омадед. Баъзе дастурҳо саҳм қабул намекунанд, вале дар ин ҷо ҳамчун иқтибос мемонанд. Якҷоя мо метавонем ин сарчашмаҳоро барои татбиқкунандагон дар тамоми ҷаҳон ва барои ҳар касе, ки самаранокии ҷараёни кор ва расонидани арзишро беҳтар кардан мехоҳад, арзишмандтар кунем."

- id: at_a_glance_title
  translation: "Мухтасар"

- id: join_discussion_button
  translation: "Ба муҳокима ҳамроҳ шавед"

- id: join_discussion_title
  translation: "Ба муҳокима дар бораи {{ .Site.Title }} ҳамроҳ шавед"

- id: join_discussion_description
  translation: "Бо ҷамоат вохӯред, он чи мебинед мубодила кунед ва ба шакл додани ояндаи {{ .Site.Title }} кумак кунед. Саҳми шумо ҷойивазнашаванда аст, то ин дастурҳо ҷисми пурра барои татбиқкунандагон шаванд."

- id: guides_intro_text
  translation: "Таҷрибаҳое, ки кор мекунанд, ва чӣ гуна онҳоро барои беҳтар кардани ҷараёни кор ва расонидани арзиш дар ҳар раванд истифода бурдан, омӯзед. Дар ин ҷо тамоми ҷисми дониш ва таҷрибаҳои нек аст. {{ .Site.Title }} хонаи дастурҳои амалӣ аст: иқтибоси озод, ки ҷамоат онро пеш мебарад, барои истифодаи усулҳои собитшуда дар кори дониш. Дастурҳо он таҷрибаҳо ва ченакҳои асосиро маҳдуд мекунанд, ки барои беҳтар кардани ҷараён, беҳтар кардани расонидани арзиш ва мустаҳкам кардани устувории гурӯҳ лозим мебошанд. Онҳо қабули васеъшавандаро дар соҳаҳои гуногун дастгирӣ мекунанд ва усулҳои дигари муосири ҷараёни корро пурра мекунанд."

