- id: join_discussion_description
  translation: "Échangez avec la communauté, partagez vos idées et contribuez à façonner l'avenir de {{ .Site.Title }}. Vos contributions sont précieuses pour faire de ces guides des ressources complètes pour les praticiens."

- id: guides_intro_text
  translation: "Découvrez des pratiques efficaces et la façon de les appliquer pour optimiser le flux de travail et la livraison de valeur, quel que soit le processus. Voici votre ressource complète de connaissances et de bonnes pratiques. {{ .Site.Title }} est le foyer des guides pratiques. C'est une référence gratuite, portée par la communauté, pour appliquer des méthodes éprouvées au travail de la connaissance. Ces guides définissent les pratiques fondamentales et les indicateurs nécessaires pour améliorer le flux, optimiser la livraison de valeur et renforcer la durabilité des équipes. Ils accompagnent des adoptions à grande échelle dans des secteurs variés et complètent d'autres approches modernes du flux de travail."

