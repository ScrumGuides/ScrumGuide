- id: implementations_section_description
  translation: "Des façons d'appliquer Scrum dans un contexte particulier. Chacune reste dans les limites de ce que Scrum cherche à faire et ajoute des conseils pour une situation donnée — plusieurs équipes sur un même produit, la gestion du flux, les débuts — sans modifier ce que Scrum exige."

- id: extensions_section_title
  translation: "Extensions"

- id: extensions_section_description
  translation: "Des pratiques qui vont au-delà de ce que Scrum traite. Une extension ne prétend pas être Scrum et ne le modifie pas ; elle prend en charge une préoccupation que Scrum laisse ouverte, comme la mesure de la valeur qu'un produit apporte."

