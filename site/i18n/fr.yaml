- id: open_source_description
  translation: "Ce projet est open source et vit de la collaboration de la communauté. Que vous souhaitiez proposer des améliorations, signaler des problèmes ou contribuer du contenu, votre participation est bienvenue. Certains guides ne sont pas ouverts aux contributions mais figurent ici à titre de référence. Ensemble, nous pouvons rendre ces ressources encore plus utiles aux praticiens du monde entier et à quiconque souhaite améliorer l'efficacité du flux de travail et la livraison de valeur."

