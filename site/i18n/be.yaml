- id: open_source_title
  translation: "Адкрытая крыніца, вядзе супольнасць"

- id: open_source_description
  translation: "Гэта праект з адкрытай крыніцай, які жыве са супрацы супольнасці. Калі хочаце прапанаваць палепшанні, паведаміць пра турботы ці паўдзельнічаць змесцівам, вы жаданыя. Некаторыя даведнікі ўдзелаў не прымаюць, але стаяць тут як пасылка. Разам мы можам зрабіць гэтыя крыніцы больш вартымі для тых, хто ўжывае па ўсім свеце, і для кожнага, хто хоча палепшыць дзейнасць плыні працы і данне вартасці."

- id: at_a_glance_title
  translation: "Коратка"

- id: join_discussion_button
  translation: "Далучыцеся да абмеркавання"

- id: join_discussion_title
  translation: "Далучыцеся да абмеркавання пра {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Спаткайце супольнасць, падзяліцеся тым, што бачыце, і дапамажыце сфармаваць будучыну {{ .Site.Title }}. Вашы ўдзелы незаменныя, каб гэтыя даведнікі сталі поўным корпусам для тых, хто ўжывае."

- id: guides_intro_text
  translation: "Вывучыце практыкі, якія працуюць, і як іх ужываць, каб найлепш наладзіць плынь працы данне вартасці ў кожным працэсе. Тут увесь корпус знання і добрых практык. {{ .Site.Title }} — дом практычных даведнікаў: вольная, вядзеная супольнасцю пасылка для ўжывання правераных спосабаў у працы са знаннем. Даведнікі абмяжоўваюць тыя асноўныя практыкі і меры, якія трэба, каб палепшыць плынь, найлепш наладзіць данне вартасці і ўмацаваць трываласць каманды. Яны падтрымліваюць пашыральнае прыняцце ў розных галінах і дапаўняюць іншыя сучасныя спосабы плыні працы."

