- id: join_discussion_title
  translation: "Присоединяйтесь к обсуждению {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Общайтесь с сообществом, делитесь своими наблюдениями и помогайте формировать будущее {{ .Site.Title }}. Ваш вклад незаменим, чтобы эти руководства были полноценным источником для практиков."

- id: guides_intro_text
  translation: "Узнайте действенные практики и то, как применять их для оптимизации потока работы и доставки ценности в любом процессе. Это ваш полный источник знаний и хороших практик. {{ .Site.Title }} — дом практических руководств: бесплатный, создаваемый сообществом ориентир для применения проверенных методов в работе со знанием. Руководства описывают основные практики и метрики, необходимые для улучшения потока, оптимизации доставки ценности и укрепления устойчивости команд. Они поддерживают масштабируемое внедрение в разных отраслях и дополняют другие современные подходы к потоку работы."

