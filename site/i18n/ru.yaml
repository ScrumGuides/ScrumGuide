- id: open_source_description
  translation: "Это проект с открытым исходным кодом, который живёт сотрудничеством сообщества. Хотите предложить улучшения, сообщить о проблемах или добавить материалы — ваше участие приветствуется. Некоторые руководства закрыты для правок, но приведены здесь для справки. Вместе мы можем сделать эти материалы ещё полезнее для практиков по всему миру и для всех, кто хочет улучшить эффективность потока работы и доставку ценности."

