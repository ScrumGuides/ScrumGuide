- id: implementations_section_description
  translation: "Способы применять Scrum в конкретном контексте. Каждое остаётся в пределах того, к чему стремится Scrum, и добавляет указания для определённой ситуации — несколько команд над одним продуктом, управление потоком, начало работы — не меняя того, что Scrum требует."

- id: extensions_section_title
  translation: "Расширения"

- id: extensions_section_description
  translation: "Практики, выходящие за пределы того, чем занимается Scrum. Расширение не претендует на то, чтобы быть Scrum, и не меняет его; оно берётся за вопрос, который Scrum оставляет открытым, например измерение ценности, которую приносит продукт."

