- id: join_discussion_description
  translation: "Toplulukla buluşun, gördüklerinizi paylaşın ve {{ .Site.Title }} için geleceği biçimlendirmeye yardım edin. Bu kılavuzların uygulayanlar için eksiksiz bir bütün olması için katkılarınız vazgeçilmezdir."

- id: guides_intro_text
  translation: "İşleyen uygulamaları ve onları her süreçte iş akışını ve değer teslimini en iyi duruma getirmek için nasıl kullanacağınızı öğrenin. Bilgi ve iyi uygulamaların bütünü burada. {{ .Site.Title }}, kullanışlı kılavuzların evidir: bilgi işinde kanıtlanmış yöntemleri kullanmak için ücretsiz, toplulukça yürütülen bir başvuru kaynağı. Kılavuzlar akışı iyileştirmek, değer teslimini en iyi duruma getirmek ve takımın sürdürülebilirliğini güçlendirmek için gereken temel uygulamaları ve ölçüleri sınırlar. Sektörler arasında ölçeklenebilir benimsemeyi destekler ve diğer çağdaş iş akışı yöntemlerini tamamlar."

