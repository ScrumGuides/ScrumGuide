- id: open_source_description
  translation: "Bu, topluluğun işbirliğiyle yaşayan bir açık kaynak projedir. İyileştirmeler önermek, sorun bildirmek ya da içerikle katkıda bulunmak isterseniz hoş karşılanırsınız. Bazı kılavuzlar katkı almıyor, ama başvuru olarak burada duruyor. Birlikte bu kaynakları dünyanın her yerindeki uygulayanlar ve iş akışı verimliliğini ile değer teslimini iyileştirmek isteyen herkes için daha değerli kılabiliriz."

