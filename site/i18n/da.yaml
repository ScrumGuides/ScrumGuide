- id: implementations_section_description
  translation: "Måder at bruge Scrum i en bestemt sammenhæng. Hver af dem holder sig inden for Scrums hensigt og tilføjer vejledning for en situation - flere teams på ét produkt, styring af flow, at komme i gang - uden at ændre, hvad Scrum kræver."

- id: extensions_section_title
