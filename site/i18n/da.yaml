- id: open_source_title
  translation: "Open source og drevet af fællesskabet"

- id: open_source_description
  translation: "Dette er et open source-projekt, der lever af samarbejdet i fællesskabet. Vil du foreslå forbedringer, rapportere problemer eller bidrage med indhold, er du velkommen. Nogle guider tager ikke imod bidrag, men står her som reference. Sammen kan vi gøre disse ressourcer mere værd for praktikere over hele verden og for alle, der vil forbedre workflowets effektivitet og værdileveringen."

- id: at_a_glance_title
  translation: "Overblik"

- id: join_discussion_button
  translation: "Deltag i drøftelsen"

- id: join_discussion_title
  translation: "Deltag i drøftelsen om {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Mød fællesskabet, del din indsigt og hjælp med at forme fremtiden for {{ .Site.Title }}. Jeres bidrag er afgørende for, at disse guider bliver hele samlingen for praktikere."

- id: guides_intro_text
  translation: "Lær de praksisser der virker, og hvordan du bruger dem til at optimere workflow og værdilevering i enhver proces. Her er hele samlingen af viden og gode praksisser. {{ .Site.Title }} er hjemsted for praktiske guider: en gratis, fællesskabsdrevet reference til at bruge gennemprøvede metoder i vidensarbejde. Guiderne afgrænser de kernepraksisser og mål, der skal til for at forbedre flow, optimere værdilevering og styrke teamets bæredygtighed. De understøtter skalerbar adoption på tværs af brancher og supplerer andre moderne workflowmetoder."

