- id: extensions_section_description
  translation: "Praksisser der rækker ud over, hvad Scrum tager sig af. En udvidelse udgiver sig ikke for at være Scrum og ændrer det ikke; den tager fat på et spørgsmål, Scrum lader stå åbent, som at måle den værdi et produkt leverer."

