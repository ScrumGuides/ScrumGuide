  translation: "Načini uporabe Scruma v določenem okviru. Vsak od njih ostaja znotraj namena Scruma in dodaja napotke za neki položaj - več ekip na enem izdelku, upravljanje pretoka, prvi koraki - ne da bi spremenil, kaj Scrum zahteva."

