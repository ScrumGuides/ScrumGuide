- id: open_source_title
  translation: "Odprta izvorna koda, vodi jo skupnost"

- id: open_source_description
  translation: "To je projekt odprte izvorne kode, ki živi od sodelovanja skupnosti. Če želite predlagati izboljšave, sporočiti težave ali prispevati vsebino, ste dobrodošli. Nekateri vodniki prispevkov ne sprejemajo, a stojijo tukaj kot sklic. Skupaj lahko naredimo to gradivo dragocenejše za tiste, ki ga izvajajo po vsem svetu, in za vsakogar, ki želi izboljšati učinkovitost poteka dela in dostavljanje vrednosti."

- id: at_a_glance_title
  translation: "Na kratko"

- id: join_discussion_button
  translation: "Pridružite se pogovoru"

- id: join_discussion_title
  translation: "Pridružite se pogovoru o {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Spoznajte skupnost, delite, kar vidite, in pomagajte oblikovati prihodnost {{ .Site.Title }}. Vaši prispevki so nepogrešljivi, da ti vodniki postanejo celotno telo za tiste, ki ga izvajajo."

- id: guides_intro_text
  translation: "Spoznajte prakse, ki delujejo, in kako jih uporabiti za optimizacijo poteka dela in dostavljanja vrednosti v vsakem procesu. Tukaj je celotno telo znanja in dobrih praks. {{ .Site.Title }} je dom praktičnih vodnikov: prosto, od skupnosti vodeno gradivo za uporabo preverjenih metod pri delu z znanjem. Vodniki začrtajo temeljne prakse in mere, potrebne za izboljšanje pretoka, za optimizacijo dostavljanja vrednosti in za krepitev vzdržnosti ekipe. Podpirajo širljivo uvajanje v vseh panogah in dopolnjujejo druge sodobne metode poteka dela."

