- id: join_discussion_title
  translation: "Uniu-vos al debat sobre {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Trobeu-vos amb la comunitat, compartiu què veieu i ajudeu a donar forma al futur de {{ .Site.Title }}. Les vostres aportacions són indispensables perquè aquestes guies siguin el cos complet per a qui ho practica."

- id: guides_intro_text
  translation: "Apreneu les pràctiques que funcionen i com fer-les servir per optimitzar el flux de treball i el lliurament de valor en qualsevol procés. Aquí hi ha tot el cos de coneixement i de bones pràctiques. {{ .Site.Title }} és la casa de les guies pràctiques: una referència lliure, impulsada per la comunitat, per fer servir mètodes provats en el treball del coneixement. Les guies delimiten les pràctiques i les mesures bàsiques que calen per millorar el flux, optimitzar el lliurament de valor i reforçar la sostenibilitat de l'equip. Donen suport a una adopció escalable en tots els sectors i complementen altres mètodes moderns de flux de treball."

