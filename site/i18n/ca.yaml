- id: implementations_section_description
  translation: "Maneres de fer servir Scrum en un context determinat. Cadascuna es manté dins de la intenció de Scrum i afegeix orientació per a una situació - diversos equips en un producte, gestionar el flux, començar - sense canviar què demana Scrum."

- id: extensions_section_title
  translation: "Extensions"

- id: extensions_section_description
  translation: "Pràctiques que van més enllà d'allò de què s'ocupa Scrum. Una extensió no es presenta com a Scrum ni el canvia; pren una qüestió que Scrum deixa oberta, com mesurar el valor que lliura un producte."

