- id: open_source_title
  translation: "Codi obert, impulsat per la comunitat"

- id: open_source_description
  translation: "Aquest és un projecte de codi obert que viu de la col·laboració de la comunitat. Si voleu proposar millores, informar de problemes o aportar contingut, hi sou benvinguts. Algunes guies no accepten aportacions, però hi són com a referència. Junts podem fer aquests recursos més valuosos per a qui ho practica arreu del món i per a qualsevol que vulgui millorar l'eficiència del flux de treball i el lliurament de valor."

- id: at_a_glance_title
