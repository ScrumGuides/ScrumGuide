- id: guides_intro_text
  translation: "Conheça práticas eficazes e como aplicá-las para otimizar o fluxo de trabalho e a entrega de valor em qualquer processo. Este é o seu recurso completo de conhecimento e boas práticas. {{ .Site.Title }} é a casa dos guias práticos: uma referência gratuita, conduzida pela comunidade, para aplicar métodos comprovados ao trabalho do conhecimento. Os guias definem as práticas fundamentais e as métricas necessárias para melhorar o fluxo, otimizar a entrega de valor e reforçar a sustentabilidade dos times. Eles apoiam adoções escaláveis em setores variados e complementam outras abordagens modernas de fluxo de trabalho."

