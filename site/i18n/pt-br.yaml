- id: open_source_title
  translation: "Código aberto e conduzido pela comunidade"

- id: open_source_description
  translation: "Este é um projeto de código aberto que vive da colaboração da comunidade. Se você quer propor melhorias, relatar problemas ou contribuir com conteúdo, sua participação é bem-vinda. Alguns guias não estão abertos a contribuições, mas estão aqui como referência. Juntos podemos tornar estes recursos ainda mais valiosos para quem pratica no mundo todo e para qualquer pessoa que queira melhorar a eficiência do fluxo de trabalho e a entrega de valor."

