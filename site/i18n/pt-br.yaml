  translation: "Formas de aplicar o Scrum em um contexto específico. Cada uma permanece dentro do que o Scrum se propõe e acrescenta orientações para uma situação — vários times em um único produto, a gestão do fluxo, o começo — sem mudar o que o Scrum exige."

