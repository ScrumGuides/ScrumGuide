- id: open_source_title
  translation: "Nyílt forráskódú, a közösség vezeti"

- id: open_source_description
  translation: "Ez egy nyílt forráskódú projekt, amely a közösség együttműködéséből él. Ha javításokat szeretne javasolni, problémákat jelenteni vagy tartalommal hozzájárulni, szívesen látjuk. Néhány útmutató nem fogad hozzájárulást, de hivatkozásként itt szerepel. Együtt értékesebbé tehetjük ezeket az anyagokat a gyakorlók számára a világ minden részén, és mindenki számára, aki javítani szeretné a munkafolyamat hatékonyságát és az értékszállítást."

- id: at_a_glance_title
  translation: "Röviden"

- id: join_discussion_button
  translation: "Csatlakozás a beszélgetéshez"

- id: join_discussion_title
  translation: "Csatlakozzon a {{ .Site.Title }}-ról szóló beszélgetéshez"

- id: join_discussion_description
  translation: "Találkozzon a közösséggel, ossza meg meglátásait, és segítsen formálni a {{ .Site.Title }} jövőjét. Az Önök hozzájárulása elengedhetetlen ahhoz, hogy ezek az útmutatók a gyakorlók teljes gyűjteményévé váljanak."

- id: guides_intro_text
  translation: "Tanulja meg azokat a gyakorlatokat, amelyek működnek, és hogyan használja őket a munkafolyamat és az értékszállítás optimalizálására bármely folyamatban. Itt a tudás és a jó gyakorlatok teljes gyűjteménye. A {{ .Site.Title }} a gyakorlati útmutatók otthona: ingyenes, közösség által vezetett hivatkozás bevált módszerek használatához a tudásmunkában. Az útmutatók körülhatárolják azokat az alapgyakorlatokat és mértékeket, amelyek az áramlás javításához, az értékszállítás optimalizálásához és a team fenntarthatóságának erősítéséhez szükségesek. Támogatják a skálázható bevezetést ágazatokon át, és kiegészítik más modern munkafolyamat-módszereket."

