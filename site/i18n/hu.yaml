- id: implementations_section_description
  translation: "Módok a Scrum használatára egy adott környezetben. Mindegyik a Scrum szándékán belül marad, és egy helyzethez ad útmutatást - több team egy terméken, az áramlás irányítása, a kezdés - anélkül, hogy megváltoztatná, mit kíván a Scrum."

