- id: extensions_section_description
  translation: "Gyakorlatok, amelyek túlnyúlnak azon, amivel a Scrum foglalkozik. Egy kiterjesztés nem adja magát Scrumnak, és nem változtatja meg; olyan kérdést vesz fel, amelyet a Scrum nyitva hagy, például a termék által nyújtott érték mérését."

