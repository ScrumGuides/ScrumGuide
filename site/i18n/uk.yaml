- id: open_source_title
  translation: "Відкритий код і спільнота"

- id: open_source_description
  translation: "Це проєкт з відкритим кодом, який живе співпрацею спільноти. Хочете запропонувати покращення, повідомити про проблеми або додати матеріали — ваша участь на вітання. Деякі посібники закриті для правок, але наведені тут для довідки. Разом ми можемо зробити ці матеріали ще кориснішими для практиків у всьому світі й для всіх, хто хоче покращити ефективність потоку роботи та доставлення цінності."

- id: at_a_glance_title
  translation: "Коротко"

- id: join_discussion_button
  translation: "Долучитися до обговорення"

- id: join_discussion_title
  translation: "Долучайтеся до обговорення {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Спілкуйтеся зі спільнотою, діліться своїми спостереженнями й допомагайте формувати майбутнє {{ .Site.Title }}. Ваш внесок незамінний, щоб ці посібники були повноцінним джерелом для практиків."

- id: guides_intro_text
  translation: "Дізнайтеся про дієві практики й те, як застосовувати їх для оптимізації потоку роботи та доставлення цінності в будь-якому процесі. Це ваше повне джерело знань і добрих практик. {{ .Site.Title }} — дім практичних посібників: безкоштовний, створюваний спільнотою орієнтир для застосування перевірених методів у роботі зі знанням. Посібники описують основні практики й метрики, потрібні для покращення потоку, оптимізації доставлення цінності та зміцнення стійкості команд. Вони підтримують масштабоване впровадження в різних галузях і доповнюють інші сучасні підходи до потоку роботи."

