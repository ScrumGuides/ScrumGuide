- id: implementations_section_description
  translation: "Способи застосовувати Скрам у конкретному контексті. Кожен залишається в межах того, до чого прагне Скрам, і додає вказівки для певної ситуації — кілька команд над одним продуктом, керування потоком, початок роботи — не змінюючи того, що Скрам вимагає."

- id: extensions_section_title
  translation: "Розширення"

- id: extensions_section_description
  translation: "Практики, що виходять за межі того, чим займається Скрам. Розширення не претендує на те, щоб бути Скрамом, і не змінює його; воно береться за питання, яке Скрам залишає відкритим, наприклад вимірювання цінності, яку дає продукт."

