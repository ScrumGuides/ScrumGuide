- id: open_source_title
  translation: "Open source og drevet av fellesskapet"

- id: open_source_description
  translation: "Dette er et open source-prosjekt som lever av samarbeidet i fellesskapet. Vil du foreslå forbedringer, rapportere problemer eller bidra med innhold, er du velkommen. Noen guider tar ikke imot bidrag, men står her som referanse. Sammen kan vi gjøre disse ressursene mer verdt for praktikere over hele verden og for alle som vil forbedre arbeidsflytens effektivitet og verdileveransen."

- id: at_a_glance_title
