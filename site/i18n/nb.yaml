- id: join_discussion_title
  translation: "Delta i diskusjonen om {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Møt fellesskapet, del innsikten din og hjelp med å forme fremtiden til {{ .Site.Title }}. Bidragene deres er avgjørende for at disse guidene skal bli hele samlingen for praktikere."

- id: guides_intro_text
  translation: "Lær praksisene som virker, og hvordan du bruker dem til å optimalisere arbeidsflyt og verdileveranse i enhver prosess. Her er hele samlingen av kunnskap og gode praksiser. {{ .Site.Title }} er hjemmet for praktiske guider: en fri, fellesskapsdrevet referanse for å bruke gjennomprøvde metoder i kunnskapsarbeid. Guidene avgrenser kjernepraksisene og målene som trengs for å forbedre flyten, optimalisere verdileveransen og styrke teamets bærekraft. De støtter skalerbar adopsjon på tvers av bransjer og utfyller andre moderne arbeidsflytmetoder."

