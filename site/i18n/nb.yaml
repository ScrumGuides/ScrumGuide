- id: extensions_section_description
  translation: "Praksiser som strekker seg utenfor det Scrum tar seg av. En utvidelse utgir seg ikke for å være Scrum og endrer det ikke; den tar fatt i et spørsmål Scrum lar stå åpent, som å måle verdien et produkt leverer."

