- id: implementations_section_description
  translation: "Måter å bruke Scrum i en bestemt sammenheng. Hver av dem holder seg innenfor Scrums hensikt og legger til veiledning for en situasjon - flere team på ett produkt, å styre flyten, å komme i gang - uten å endre hva Scrum krever."

- id: extensions_section_title
