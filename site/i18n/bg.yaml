- id: implementations_section_description
  translation: "Начини да се използва Scrum в определен контекст. Всяко от тях остава в рамките на намерението на Scrum и добавя насоки за дадена ситуация - няколко екипа по един продукт, управление на потока, започване - без да променя какво Scrum иска."

- id: extensions_section_title
