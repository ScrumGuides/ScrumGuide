- id: open_source_title
  translation: "Отворен код, водено от общността"

- id: open_source_description
  translation: "Това е проект с отворен код, който живее от сътрудничеството на общността. Ако искате да предложите подобрения, да съобщите за проблеми или да допринесете със съдържание, добре дошли сте. Някои ръководства не приемат принос, но стоят тук като справка. Заедно можем да направим тези ресурси по-ценни за практикуващите по целия свят и за всеки, който иска да подобри ефективността на работния поток и доставянето на стойност."

- id: at_a_glance_title
  translation: "Накратко"

- id: join_discussion_button
  translation: "Присъединете се към обсъждането"

- id: join_discussion_title
  translation: "Присъединете се към обсъждането на {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Срещнете общността, споделете какво виждате и помогнете да се оформи бъдещето на {{ .Site.Title }}. Вашият принос е незаменим, за да станат тези ръководства цялото тяло за практикуващите."

- id: guides_intro_text
  translation: "Научете практиките, които работят, и как да ги използвате, за да оптимизирате работния поток и доставянето на стойност във всеки процес. Тук е цялото тяло от знание и добри практики. {{ .Site.Title }} е домът на практичните ръководства: свободна, водена от общността справка за използване на доказани методи в работата със знание. Ръководствата очертават основните практики и мерки, нужни за подобряване на потока, за оптимизиране на доставянето на стойност и за укрепване на устойчивостта на екипа. Подкрепят скалируемо възприемане в различни отрасли и допълват други съвременни методи за работен поток."

