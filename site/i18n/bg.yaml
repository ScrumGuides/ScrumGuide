- id: extensions_section_description
  translation: "Практики, които стигат отвъд онова, с което се занимава Scrum. Разширението не се представя за Scrum и не го променя; заема се с въпрос, който Scrum оставя открит, като измерването на стойността, която един продукт доставя."

