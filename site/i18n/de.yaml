- id: open_source_title
  translation: "Open Source und von der Community getragen"

- id: open_source_description
  translation: "Dies ist ein Open-Source-Projekt, das von der Zusammenarbeit der Community lebt. Ob Sie Verbesserungen vorschlagen, Probleme melden oder Inhalte beitragen möchten: Ihre Mitwirkung ist willkommen. Einige Guides stehen Beiträgen nicht offen, sind hier aber als Referenz aufgeführt. Gemeinsam können wir diese Ressourcen für Praktiker weltweit und für alle, die Arbeitsfluss und Wertlieferung verbessern wollen, noch wertvoller machen."

- id: at_a_glance_title
  translation: "Auf einen Blick"

