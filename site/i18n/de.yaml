- id: implementations_section_description
  translation: "Wege, Scrum in einem bestimmten Kontext anzuwenden. Jeder bleibt innerhalb dessen, was Scrum erreichen soll, und ergänzt Hinweise für eine bestimmte Situation — mehrere Teams an einem Produkt, Steuerung des Flusses, der Anfang — ohne zu ändern, was Scrum verlangt."

- id: extensions_section_title
  translation: "Erweiterungen"

- id: extensions_section_description
  translation: "Praktiken, die über das hinausgehen, was Scrum behandelt. Eine Erweiterung erhebt nicht den Anspruch, Scrum zu sein, und ändert Scrum nicht; sie nimmt sich eines Themas an, das Scrum offenlässt, etwa der Messung des Werts, den ein Produkt liefert."

