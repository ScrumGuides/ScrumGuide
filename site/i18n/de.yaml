- id: join_discussion_title
  translation: "An der Diskussion zu {{ .Site.Title }} teilnehmen"

- id: join_discussion_description
  translation: "Tauschen Sie sich mit der Community aus, teilen Sie Ihre Erkenntnisse und helfen Sie, die Zukunft von {{ .Site.Title }} zu gestalten. Ihre Beiträge sind unverzichtbar, um diese Guides zu umfassenden Quellen für Praktiker zu machen."

- id: guides_intro_text
  translation: "Lernen Sie wirksame Praktiken kennen und erfahren Sie, wie Sie sie anwenden, um Arbeitsfluss und Wertlieferung über jeden Prozess hinweg zu optimieren. Dies ist Ihre umfassende Quelle für Wissen und bewährte Praktiken. {{ .Site.Title }} ist die Heimat praxisnaher Guides: eine kostenlose, von der Community getragene Referenz für die Anwendung erprobter Methoden in der Wissensarbeit. Die Guides beschreiben die grundlegenden Praktiken und die Kennzahlen, die nötig sind, um den Fluss zu verbessern, die Wertlieferung zu optimieren und die Belastbarkeit von Teams zu stärken. Sie unterstützen skalierbare Einführungen in unterschiedlichen Branchen und ergänzen andere moderne Ansätze für den Arbeitsfluss."

