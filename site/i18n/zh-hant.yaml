- id: implementations_section_description
  translation: "在特定情境中運用 Scrum 的方式。每一份都停留在 Scrum 意圖之內，並為某種情形補充指引——多個團隊共同開發一個產品、管理流動、剛剛起步——而不改變 Scrum 的要求。"

