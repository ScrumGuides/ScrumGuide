- id: guides_intro_text
  translation: "了解有效的實務，以及如何運用它們，在任何流程中最佳化工作流與價值交付。這裡是知識與良好實務的完整資源。{{ .Site.Title }} 是實用指南之家：一個免費、由社群推動的參考，用於在知識工作中運用經過驗證的方法。這些指南界定了改善流動、最佳化價值交付、增強團隊永續性所需的核心實務與度量。它們支持在各行各業中可擴充的採用，並與其他現代工作流方法互為補充。"

