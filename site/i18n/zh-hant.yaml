- id: open_source_description
  translation: "這是一個依靠社群協作的開源專案。無論你想提出改進、回報問題還是貢獻內容，都歡迎參與。部分指南不接受貢獻，但仍列於此處作為參考。我們可以共同讓這些資源對全世界的實踐者，以及任何希望提升工作流效率與價值交付的人，更有價值。"

