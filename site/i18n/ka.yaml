- id: join_discussion_title
  translation: "შემოუერთდით განხილვას {{ .Site.Title }}-ის შესახებ"

- id: join_discussion_description
  translation: "შეხვდით თემს, გაგვიზიარეთ, რასაც ხედავთ, და დაეხმარეთ {{ .Site.Title }}-ის მომავლის ჩამოყალიბებაში. თქვენი წვლილი შეუცვლელია, რათა ეს სახელმძღვანელოები გახდეს სრული სხეული მათთვის, ვინც იყენებს."

- id: guides_intro_text
  translation: "შეისწავლეთ პრაქტიკები, რომლებიც მუშაობს, და როგორ გამოიყენოთ ისინი სამუშაო ნაკადისა და ღირებულების მიტანის ოპტიმიზაციისთვის ყოველ პროცესში. აქაა ცოდნისა და კარგი პრაქტიკების მთელი სხეული. {{ .Site.Title }} პრაქტიკული სახელმძღვანელოების სახლია: თავისუფალი, თემის მიერ ტარებული მიმართვა დადასტურებული მეთოდების ცოდნის სამუშაოში გამოყენებისთვის. სახელმძღვანელოები შემოფარგლავენ იმ ძირითად პრაქტიკებსა და საზომებს, რომლებიც საჭიროა ნაკადის გასაუმჯობესებლად, ღირებულების მიტანის ოპტიმიზაციისთვის და გუნდის მდგრადობის გასამყარებლად. ისინი უჭერენ მხარს მასშტაბირებად მიღებას სხვადასხვა დარგში და ავსებენ სამუშაო ნაკადის სხვა თანამედროვე მეთოდებს."

