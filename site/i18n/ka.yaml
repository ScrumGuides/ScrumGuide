- id: open_source_description
  translation: "ეს ღია წყაროს პროექტია, რომელიც თემის თანამშრომლობით ცხოვრობს. თუ გსურთ გაუმჯობესებების შემოთავაზება, ხარვეზების შეტყობინება ან შინაარსით წვლილის შეტანა, მოგესალმებით. ზოგი სახელმძღვანელო წვლილს არ იღებს, მაგრამ აქ დგას მიმართვად. ერთად შეგვიძლია ეს წყაროები უფრო ღირებული გავხადოთ მათთვის, ვინც იყენებს მთელ მსოფლიოში, და ყველასთვის, ვისაც სურს სამუშაო ნაკადის ქმედითობისა და ღირებულების მიტანის გაუმჯობესება."

