- id: join_discussion_title
  translation: "Придружите се разговору о {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Сретните заједницу, поделите шта видите и помозите обликовати будућност {{ .Site.Title }}. Ваши су доприноси неопходни да ови водичи постану цело тело за оне који упражњавају."

- id: guides_intro_text
  translation: "Научите праксе које раде и како их користити да оптимизујете ток рада и доставу вредности у сваком процесу. Овде је цело тело знања и добрих пракси. {{ .Site.Title }} дом је практичних водича: слободна референца коју води заједница, за коришћење доказаних метода у раду са знањем. Водичи ограђују темељне праксе и мере потребне да се побољша ток, оптимизује достава вредности и ојача одрживост тима. Подупиру скалабилно прихватање у различитим гранама и допуњују друге савремене методе тока рада."

