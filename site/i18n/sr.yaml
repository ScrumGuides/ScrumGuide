- id: open_source_title
  translation: "Отворени код, води га заједница"

- id: open_source_description
  translation: "Ово је пројекат отвореног кода који живи од сарадње заједнице. Желите ли предложити побољшања, пријавити проблеме или допринети садржајем, добродошли сте. Неки водичи не примају доприносе, али стоје овде као референца. Заједно можемо ове изворе учинити вреднијима за оне који упражњавају широм света и за свакога који жели побољшати учинковитост тока рада и доставу вредности."

- id: at_a_glance_title
