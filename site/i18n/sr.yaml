- id: implementations_section_description
  translation: "Начини коришћења Scrum-а у одређеном контексту. Сваки од њих остаје унутар намере Scrum-а и додаје упутства за неку ситуацију - више тимова на једном производу, управљање током, почетак - а да не мења шта Scrum тражи."

