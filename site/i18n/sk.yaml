- id: join_discussion_title
  translation: "Pripojte sa k diskusii o {{ .Site.Title }}"

- id: join_discussion_description
  translation: "Stretnite komunitu, podeľte sa o svoje poznatky a pomôžte formovať budúcnosť {{ .Site.Title }}. Vaše prispenie je nevyhnutné, aby sa tieto príručky stali úplným súborom pre praktikov."

- id: guides_intro_text
  translation: "Naučte sa praktiky, ktoré fungujú, a ako ich používať na optimalizáciu pracovného toku a doručovania hodnoty v akomkoľvek procese. Tu je celý súbor znalostí a dobrých praktík. {{ .Site.Title }} je domovom praktických príručiek: slobodného, komunitou vedeného zdroja na používanie overených metód v znalostnej práci. Príručky vymedzujú základné praktiky a meradlá potrebné na lepší tok, na optimalizáciu doručovania hodnoty a na posilnenie udržateľnosti teamu. Podporujú škálovateľné prijatie v rôznych odvetviach a dopĺňajú ďalšie moderné metódy pracovného toku."

