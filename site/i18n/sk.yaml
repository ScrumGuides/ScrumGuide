- id: open_source_title
  translation: "Open source, vedené komunitou"

- id: open_source_description
  translation: "Toto je open source projekt, ktorý žije zo spolupráce komunity. Ak chcete navrhnúť zlepšenia, nahlásiť problémy alebo prispieť obsahom, ste vítaní. Niektoré príručky prispenie neprijímajú, ale sú tu ako referencia. Spoločne môžeme tieto zdroje urobiť cennejšími pre praktikov po celom svete a pre každého, kto chce zvýšiť účinnosť pracovného toku a doručovania hodnoty."

- id: at_a_glance_title
