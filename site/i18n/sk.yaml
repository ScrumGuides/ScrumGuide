  translation: "Praktiky, ktoré sahajú za to, o čo sa stará Scrum. Rozšírenie sa nevydáva za Scrum ani ho nemení; berie si na starosť otázku, ktorú Scrum necháva otvorenú, ako je meranie hodnoty, ktorú produkt prináša."

