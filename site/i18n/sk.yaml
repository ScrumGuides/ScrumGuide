- id: implementations_section_description
  translation: "Spôsoby, ako používať Scrum v určitom kontexte. Každá z nich zostáva v rámci zámeru Scrumu a pridáva pokyny pre určitú situáciu - viac teamov na jednom produkte, riadenie toku, začiatky - bez toho, aby sa menilo, čo Scrum vyžaduje."

