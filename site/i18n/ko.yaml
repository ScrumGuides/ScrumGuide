- id: join_discussion_description
  translation: "커뮤니티와 이야기 나누고, 알게 된 바를 공유하고, {{ .Site.Title }}의 앞날을 만들어 가는 데 힘을 보태 주세요. 이 가이드들이 실무자를 위한 온전한 자료가 되려면 여러분의 기여가 꼭 필요합니다."

- id: guides_intro_text
  translation: "어떤 프로세스에서든 워크플로와 가치 전달을 최적화하도록 돕는 효과적인 실천법과 그 적용 방법을 알아보세요. 지식과 좋은 실천법을 모은 종합 자료입니다. {{ .Site.Title }}은 실용적인 가이드의 보금자리이며, 지식 노동에 검증된 방법을 적용하기 위한 무료의, 커뮤니티가 이끄는 참고 자료입니다. 각 가이드는 흐름을 개선하고 가치 전달을 최적화하며 팀의 지속 가능성을 높이는 데 필요한 핵심 실천법과 지표를 규정합니다. 여러 업종에서 확장 가능한 도입을 뒷받침하고, 워크플로에 관한 다른 현대적 접근을 보완합니다."

