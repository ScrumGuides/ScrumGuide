- id: open_source_description
  translation: "이것은 커뮤니티의 협력으로 살아가는 오픈 소스 프로젝트입니다. 개선을 제안하든, 문제를 알리든, 내용을 보태든 여러분의 참여를 환영합니다. 일부 가이드는 기여를 받지 않지만 참고를 위해 함께 실었습니다. 우리는 함께 이 자료들을 전 세계 실무자와, 워크플로의 효율과 가치 전달을 높이고자 하는 모든 이에게 더 값진 것으로 만들 수 있습니다."

