      description: Toutes les versions publiées du Guide Scrum en un seul endroit, depuis 2010, avec les guides de mise en œuvre qui s'appuient sur lui.
      keywords: Guide Scrum, Scrum, versions du Guide Scrum, historique du Guide Scrum, Guide Scrum 2026, contrôle empirique des processus, conditions Scrum, guides de mise en œuvre, Guide Kanban pour les Scrum Teams
  de:
    label: Deutsch
