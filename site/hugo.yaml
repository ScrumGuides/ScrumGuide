title: Scrum Guides

buildFuture: true
publishDir: ../public
resourceDir: ../resources
summaryLength: 30
enableRobotsTXT: true

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
disableDefaultLanguageRedirect: false
enableMissingTranslationPlaceholders: true
printI18nWarnings: true

languages:
  en:
    # `label` replaced `languageName` in Hugo 0.158. The sibling sites still use
    # the old key and warn on every build; this one does not.
    label: English
    weight: 1
    title: Scrum Guides
    params:
      seo_title: "Scrum Guides | Every version, one lineage"
      description: Every published version of the Scrum Guide in one place, from 2010 onward, with the implementation guides that build on it.
      keywords: Scrum Guide, Scrum, Scrum Guide versions, Scrum Guide history, Scrum Guide 2026, empirical process control, Scrum conditions, implementation guides, Kanban Guide for Scrum Teams
  fr:
    label: Français
    weight: 19
    title: Le Guide Scrum
    params:
      seo_title: "Le Guide Scrum | Toutes les versions, une seule filiation"
      description: Toutes les versions publiées du Guide Scrum en un seul endroit, depuis 2010, avec les guides de mise en œuvre qui s'appuient sur lui.
      keywords: Guide Scrum, Scrum, versions du Guide Scrum, historique du Guide Scrum, Guide Scrum 2026, contrôle empirique des processus, conditions Scrum, guides de mise en œuvre, Guide Kanban pour les Scrum Teams
  de:
    label: Deutsch
    weight: 12
    title: Der Scrum Guide
    params:
      description: Jede veröffentlichte Fassung des Scrum Guide an einem Ort, zusammen mit den Umsetzungsguides, die darauf aufbauen.
  es-es:
    label: Español (España)
    weight: 17
    title: La Guía Scrum
    params:
      description: Todas las versiones publicadas de la Guía Scrum en un mismo lugar, junto con las guías de implementación que se apoyan en ella.
  it:
    label: Italiano
    weight: 22
  nl:
    label: Nederlands
    weight: 32
    title: De Scrum Gids
    params:
      description: Elke gepubliceerde versie van de Scrum Gids op één plek, samen met de implementatiegidsen die daarop voortbouwen.
  pl:
    label: Polski
    weight: 33
    title: Przewodnik Scrum
    params:
      description: Każda opublikowana wersja Przewodnika Scrum w jednym miejscu, razem z przewodnikami wdrożeniowymi, które na nim się opierają.
  es-419:
    label: Español (Latinoamérica)
    weight: 14
    title: La Guía Scrum
    params:
      description: Todas las versiones publicadas de la Guía Scrum en un mismo lugar, junto con las guías de implementación que se apoyan en ella.
  pt-br:
    label: Português (Brasil)
    weight: 34
    title: O Guia do Scrum
    params:
      description: Todas as versões publicadas do Guia do Scrum em um só lugar, junto com os guias de implementação que se apoiam nele.
  pt-pt:
    label: Português (Portugal)
    weight: 35
    title: O Guia do Scrum
    params:
      description: Todas as versões publicadas do Guia do Scrum em um só lugar, junto com os guias de implementação que se apoiam nele.
  ru:
    label: Русский
    weight: 37
    title: Руководство по Scrum
    params:
      description: Все опубликованные версии Руководства по Scrum в одном месте, вместе с руководствами по внедрению, которые на него опираются.
  uk:
    label: Українська
    weight: 45
    title: Посібник зі Скраму
    params:
      description: Усі опубліковані версії Посібника зі Скраму в одному місці, разом із посібниками з упровадження, що на нього спираються.
  ja:
    label: 日本語
    weight: 23
    title: スクラムガイド
    params:
      description: スクラムガイドの公開されたすべてのバージョンを一か所に、それを土台とする実装ガイドとあわせて。
  zh-hans:
    label: 简体中文
    weight: 49
    title: Scrum 指南
    params:
      description: Scrum 指南已发布的每一个版本汇于一处，并附上以其为基础的实施指南。
  ko:
    label: 한국어
    weight: 26
    title: 스크럼 가이드
    params:
      description: 스크럼 가이드의 발행된 모든 버전을 한곳에, 그 위에 쌓아 올린 구현 가이드와 함께.
  zh-hant:
    label: 繁體中文
    weight: 50
    title: Scrum 指南
    params:
      description: Scrum 指南已發布的每一個版本匯於一處，並附上以其為基礎的實作指南。
  da:
    label: Dansk
    weight: 11
  sv:
    label: Svenska
    weight: 42
  nb:
    label: Norsk bokmål
    weight: 31
  fi:
    label: Suomi
    weight: 16
  cs:
    label: Čeština
    weight: 9
  sk:
    label: Slovenčina
    weight: 38

params:
  description: Every published version of the Scrum Guide in one place, with the implementation guides that build on it.
  keywords: Scrum Guide, Scrum
  # TODO (run 2): replace with the real domain once registered. Until then these
  # are the generated Static Web App hostnames (Bicep `defaultHostname` output).
  siteProdUrl: https://ashy-glacier-04fc55110.5.azurestaticapps.net/
  productionSiteUrl: https://ashy-glacier-04fc55110.5.azurestaticapps.net/
  previewSiteUrl: https://ashy-glacier-04fc55110-preview.centralus.5.azurestaticapps.net/
  supportEmail: support@scrumguides.org
  githubUrl: https://github.com/ScrumGuides/ScrumGuide
  # TODO (run 1): add a 1200x630 PNG for og_image. Social cards do not render SVG.
  og_image: /images/scrum-guide-logo.svg
  logo_image: /images/scrum-guide-logo.svg
  menu_logo: /images/scrum-guide-logo.svg
  AzureSitesConfig: "#{Guides_AzureSitesConfig}#"
  GitVersion_SemVer: v#{GitVersion.SemVer}#
  GoogleTagManagerID: ""
  features:
    guideDetails: false

sitemap:
  filename: sitemap.xml
  changefreq: monthly
  priority: 0.5

rss:
  filename: rss.xml
  name: RSS Feed
  description: Subscribe to our RSS feed

outputs:
  home:
    - html
    - json
    - rss
    - languages
  section:
    - html
    - rss
  taxonomy:
    - html
    - rss
  term:
    - html
    - rss
  page:
    - html
    - rss

outputFormats:
  json:
    mediaType: application/json
    baseName: pages
  languages:
    mediaType: application/json
    baseName: languages
    isPlainText: true

disableKinds:
  - taxonomy

permalinks:
  term:
    categories: "/:slug/"

taxonomies:
  category: categories

module:
  imports:
    - path: github.com/nkdAgility/OpenGuidePlatform/system/OpenGuidePlatform.Hugo.Guides

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      table: true
      linkify: true
      typographer: true
      footnote: true
    parser:
      attribute:
        block: true
        title: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
