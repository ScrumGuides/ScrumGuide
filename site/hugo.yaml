title: The Scrum Guide

buildFuture: true
publishDir: ../public
resourceDir: ../resources
summaryLength: 30
enableRobotsTXT: true

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
disableDefaultLanguageRedirect: false
