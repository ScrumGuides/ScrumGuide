# Credits for The Scrum Guide.
#
# Ken Schwaber and Jeff Sutherland wrote the Scrum Guide and are its only
# credited authors. Every edition says so on its own cover: "Developed and
# sustained by Ken Schwaber and Jeff Sutherland".
#
# The acknowledgements inside each edition thank other people for their part
# in Scrum itself over the years. They are not authors of this guide, so they
# are not listed here.
#
# Edition 2026.1 is different. It is a derived work, written by Martin
# Hinshelwood from the November 2020 edition under CC BY-SA 4.0, and it is not
# published or endorsed by Ken Schwaber or Jeff Sutherland. They are not
# credited with it, and he is not credited with any edition before it.
#
# The `guideCover` flag marks the people named on an edition's own cover. Which
# contributor views select on it is set under params.contributorFilters in
# hugo.yaml.

- name: Ken Schwaber
  role: creator
  flags: [guideCover]
  weight: 1
  contributions:
    - "2009.11"
    - "2010.2"
    - "2011.7"
    - "2011.10"
    - "2013.7"
    - "2016.7"
    - "2017.11"
    - "2020.11"
- name: Jeff Sutherland
  role: creator
  flags: [guideCover]
  weight: 2
  contributions:
    - "2009.11"
    - "2010.2"
    - "2011.7"
    - "2011.10"
    - "2013.7"
    - "2016.7"
    - "2017.11"
    - "2020.11"
- name: Martin Hinshelwood
  role: contributor
  weight: 3
  contributions:
    - "2026.1"
- name: Stas Pavlov
  role: contributor
  weight: 100
  contributions:
    - "2026.1"