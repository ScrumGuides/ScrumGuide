# Credits for The Scrum Guide.
#
# Every record here is taken from the acknowledgements printed in the editions
# themselves, not inferred. `contributions` lists the editions whose own pages
# name that person, so a reader sees who was credited when.
#
# Two spellings were corrected by the publishers themselves and are recorded
# under the spelling they settled on: November 2009 prints "Jeff Mckenna" and
# "Mike Beadle", which February 2010 onward prints as "Jeff McKenna" and
# "Mike Beedle".

