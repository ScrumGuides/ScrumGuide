# This workflow is managed by gh actions-lock.
# Site-owned caller.
#
# One job, on purpose. This used to call OpenGuidePlatform's reusable workflow,
# which runs the same stages as six separate jobs. GitHub gives every job its
# own machine, so each one had to upload what the next needed and download it
# again: the built site went up twice per run, about 36 MB, and none of it was
# wanted afterwards. Four days of that filled the artifact storage quota and
# blocked every build in the repository.
#
# Running the stages in a single job removes the reason those uploads existed.
# Nothing is handed between machines, so nothing is stored. It also installs
# the build dependencies once rather than once per job.
#
# `build.ps1 All -Deploy` is the whole pipeline: Prepare, Build and Validate,
# then Deploy, then Verify against the URL the deployment actually returned
# rather than against an uploaded copy of it.
name: Build & Validate (GuideSite)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*', '[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # GitVersion reads tag and branch history, and the delivery ring is
          # derived from it. A shallow clone gives it nothing to work from.
          fetch-depth: 0

      # Dependencies and the pipeline run in one step, not two. Installing the
      # dependencies puts hugo and the rest on PATH for the process that
      # installed them; a separate step is a new process, and Prepare then
      # fails with "The term 'hugo' is not recognized".
      - name: Install dependencies, then prepare, build, validate, deploy and verify
        shell: pwsh
        env:
          # The deploy stage reads this name directly.
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          # Deploy on pushes, and on pull requests from this repository only:
          # a fork's pull request cannot read the secret above, so deploying it
          # would fail.
          #
          # This does NOT choose the environment. The ring comes from GitVersion
          # via .github/GitVersion.yml, with Target left at its default of auto:
          # main carries the label `preview`, so a push to main deploys to the
          # preview environment. Production is reachable only from a release
          # branch or a release tag, and Resolve-GuideDeliveryContext throws if
          # a preview or canary ring ever selects the production environment.
          DEPLOY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # Resolve-OpenGuidePlatform.ps1 installs powershell-yaml itself,
          # hardcoded to AllUsers scope, and exposes no parameter to change it.
          # A hosted runner refuses that. The install is guarded by a check for
          # the module, so putting it there first at CurrentUser scope means
          # that call and every later one inside build.ps1 skip it.
          Install-Module powershell-yaml -MinimumVersion 0.4.12 -Scope CurrentUser -Force -Repository PSGallery

          # The repository's build.ps1 is a generated adapter and does not
          # expose -DependencyScope, so it would install at AllUsers and be
          # refused as well. The platform package ships its own entry point
          # that takes the scope; this is the one call that uses it.
          $platform = & ./.OpenGuidePlatform/Resolve-OpenGuidePlatform.ps1 -WorkspaceRoot $PWD
          $settings = & ./.OpenGuidePlatform/Resolve-OpenGuidePlatform.ps1 -WorkspaceRoot $PWD -ReadSettings
          & "$platform/build.ps1" -Product GuideSite -Stage Dependencies -DependencyScope CurrentUser -WorkspaceRoot $PWD -SourcePath $settings.site.source

          if ($env:DEPLOY -eq 'true') {
            ./build.ps1 All -Deploy
          } else {
            ./build.ps1 All
          }
